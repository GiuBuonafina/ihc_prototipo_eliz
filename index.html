<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eliz — protótipo</title>
<meta name="description" content="Protótipo navegável do Eliz: trilhas, chatbot, progresso e mentoria para mulheres e minorias em tecnologia.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='12' fill='%235B21B6'/%3E%3Cpath d='M26 11H13V29H27M13 20H23.5' fill='none' stroke='%23F4EEFF' stroke-width='4.2' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M31.5 3.8L32.8 7.2L36.2 8.5L32.8 9.8L31.5 13.2L30.2 9.8L26.8 8.5L30.2 7.2Z' fill='%23F1B24A'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Sora:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --plum-950:#160827; --plum-900:#1F0B37; --plum-800:#2A0E4A; --plum-700:#3A1563;
  --violet:#5B21B6; --violet-hover:#4C1A9C; --violet-soft:#EEE7FA; --violet-ink:#4A1A99;
  --gold:#F1B24A; --gold-ink:#7A4A00;
  --bg:#F6F3FB; --surface:#FFFFFF; --surface-2:#FAF8FD; --line:#E3DAF1; --line-strong:#CBBBE6;
  --ink:#1D1530; --ink-2:#554A6B; --ink-3:#655B7A;
  --ok:#11704D; --ok-soft:#E3F4EC; --on-violet:#fff; --err:#B4233E; --err-soft:#FBE8EC; --warn-soft:#FFF4DC;
  --radius-lg:20px; --radius:12px; --radius-sm:8px;
  --shadow:0 1px 2px rgba(42,14,74,.06), 0 8px 24px -12px rgba(42,14,74,.18);
  --fs:1;
  --font-body:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-display:"Sora", "Atkinson Hyperlegible", system-ui, sans-serif;
  color-scheme:light;
}
:root[data-theme="escuro"]{
  --bg:#120A20; --surface:#1B1130; --surface-2:#22173A; --line:#33264F; --line-strong:#4A3970;
  --ink:#EFE9F9; --ink-2:#BDB2D3; --ink-3:#9A8FB2;
  --violet:#9B6CF5; --violet-hover:#AE87F7; --violet-soft:#2C1D4B; --violet-ink:#CDB6FB;
  --gold-ink:#F6C76E; --on-violet:#160827; --ok:#4CC392; --ok-soft:#173326; --err:#F2788D; --err-soft:#3A1622; --warn-soft:#3A2C12;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 30px -14px rgba(0,0,0,.6);
  color-scheme:dark;
}
:root.alto-contraste{ --line:#6B5A8C; --line-strong:#3A1563; --ink-2:#2E2445; --ink-3:#463A5E; --violet:#3F0F8C; }
:root.alto-contraste[data-theme="escuro"]{ --line:#8C7BB0; --line-strong:#CDB6FB; --ink-2:#E2DAF2; --ink-3:#D2C8E6; --violet:#C3A6FF; }
*{box-sizing:border-box}
html{font-size:calc(16px * var(--fs)); -webkit-text-size-adjust:100%}
body{margin:0; background:var(--bg); color:var(--ink); font-family:var(--font-body); line-height:1.55; -webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--font-display); line-height:1.2; margin:0; letter-spacing:-.01em; font-weight:600}
h1{font-size:1.75rem} h2{font-size:1.3rem} h3{font-size:1.05rem}
p{margin:0}
a{color:var(--violet)}
button,input,select,textarea{font:inherit; color:inherit}
:focus-visible{outline:3px solid var(--gold); outline-offset:2px; border-radius:6px}
.sr-only{position:absolute; width:1px; height:1px; margin:-1px; padding:0; border:0; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}
.table-wrap, .avail-wrap, .avail-grid button, .slot, .seg button, .opt, .menu, main{position:relative}
.skip{position:absolute; left:-999px; top:8px; background:var(--gold); color:#1d1530; padding:8px 12px; border-radius:8px; z-index:99}
.skip:focus{left:8px}
svg.i{width:20px; height:20px; flex:none; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round}

/* ---------- botões e campos ---------- */
.btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; min-height:44px; padding:0 18px; border-radius:999px; border:1px solid transparent; font-weight:700; cursor:pointer; text-decoration:none; white-space:nowrap; transition:background .15s, border-color .15s}
.btn svg.i{width:18px; height:18px}
.btn-primary{background:var(--violet); color:#fff}
.btn-primary:hover{background:var(--violet-hover)}
:root[data-theme="escuro"] .btn-primary{color:#160827}
.btn-secondary{background:var(--surface); border-color:var(--line-strong); color:var(--ink)}
.btn-secondary:hover{border-color:var(--violet); color:var(--violet)}
.btn-ghost{background:transparent; color:var(--violet); padding:0 10px}
.btn-ghost:hover{background:var(--violet-soft)}
.btn-danger{background:var(--err); color:#fff}
.btn-gold{background:var(--gold); color:#2A0E4A}
.btn-gold:hover{filter:brightness(1.05)}
.btn-sm{min-height:36px; padding:0 14px; font-size:.9rem}
.btn[disabled]{opacity:.5; cursor:not-allowed}
.icon-btn{width:44px; height:44px; display:inline-grid; place-items:center; border-radius:12px; border:1px solid transparent; background:transparent; cursor:pointer; color:var(--ink-2); position:relative}
.icon-btn:hover{background:var(--violet-soft); color:var(--violet)}
.field{display:flex; flex-direction:column; gap:6px; margin-bottom:16px}
.field label{font-weight:700; font-size:.95rem}
.field .hint{font-size:.85rem; color:var(--ink-3)}
.input, select.input, textarea.input{width:100%; min-height:46px; padding:10px 14px; border:1.5px solid var(--line-strong); border-radius:var(--radius); background:var(--surface); outline:none}
textarea.input{min-height:96px; resize:vertical}
.input:focus{border-color:var(--violet); box-shadow:0 0 0 4px var(--violet-soft)}
.input[aria-invalid="true"]{border-color:var(--err)}
.field-err{display:flex; gap:6px; align-items:flex-start; color:var(--err); font-size:.9rem}
.field-err svg.i{width:16px; height:16px; margin-top:3px}
.pw-wrap{position:relative}
.pw-wrap .input{padding-right:52px}
.pw-wrap .icon-btn{position:absolute; right:2px; top:1px}
.check{display:flex; gap:10px; align-items:flex-start; cursor:pointer}
.check input{width:20px; height:20px; accent-color:var(--violet); margin-top:2px}

/* mensagens (Seção 4.5) */
.alert{display:flex; gap:12px; padding:14px 16px; border-radius:var(--radius); border:1px solid; margin-bottom:16px}
.alert svg.i{margin-top:2px}
.alert-err{background:var(--err-soft); border-color:color-mix(in srgb, var(--err) 35%, transparent); color:var(--ink)}
.alert-err svg.i{color:var(--err)}
.alert-ok{background:var(--ok-soft); border-color:color-mix(in srgb, var(--ok) 35%, transparent)}
.alert-ok svg.i{color:var(--ok)}
.alert-info{background:var(--violet-soft); border-color:var(--line-strong)}
.alert-info svg.i{color:var(--violet)}
.alert .code{display:block; margin-top:4px; font-size:.82rem; color:var(--ink-3)}
.alert .code button{background:none; border:0; padding:0; color:var(--violet); text-decoration:underline; cursor:pointer; font-size:inherit}

/* ---------- autenticação ---------- */
.auth{min-height:100vh; display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.auth-art{background:var(--plum-800); color:#F4EEFF; padding:48px clamp(32px,5vw,72px); display:flex; flex-direction:column; justify-content:space-between; position:relative; overflow:hidden}
.auth-art h1{font-size:clamp(2rem,3.4vw,3rem); font-weight:600; max-width:14ch; line-height:1.1; color:#fff}
.auth-art p{color:#D9CCF2; max-width:40ch; margin-top:18px; font-size:1.05rem}
.auth-art .route{position:absolute; right:-40px; bottom:-30px; width:420px; opacity:.9}
.auth-form{display:flex; align-items:center; justify-content:center; padding:40px 24px}
.auth-card{width:100%; max-width:420px}
.auth-card h2{font-size:1.6rem; margin-bottom:6px}
.auth-card .sub{color:var(--ink-2); margin-bottom:24px}
.demo-box{margin-top:28px; padding:16px; border:1px dashed var(--line-strong); border-radius:var(--radius); background:var(--surface-2)}
.demo-box p{font-size:.9rem; color:var(--ink-2); margin-bottom:10px}
.demo-box .row{display:flex; flex-wrap:wrap; gap:8px}
.brand{display:flex; align-items:center; gap:10px; font-family:var(--font-display); font-weight:700; font-size:1.35rem; color:inherit; text-decoration:none}
.brand-mark{width:34px; height:34px; border-radius:10px; background:var(--gold); color:var(--plum-800); display:grid; place-items:center; font-weight:700; font-size:1.05rem}

/* ---------- estrutura ---------- */
.shell{display:grid; grid-template-columns:248px minmax(0,1fr); min-height:100vh; background:linear-gradient(90deg, var(--plum-800) 248px, transparent 248px)}
.side{background:var(--plum-800); color:#E7DDF9; padding:22px 14px; position:sticky; top:0; height:100vh; display:flex; flex-direction:column; gap:22px}
.side .brand{padding:0 8px; color:#fff}
.nav{display:flex; flex-direction:column; gap:4px}
.nav a{display:flex; align-items:center; gap:12px; padding:11px 12px; border-radius:12px; color:#D8CCF0; text-decoration:none; font-weight:700}
.nav a:hover{background:rgba(255,255,255,.07); color:#fff}
.nav a[aria-current="page"]{background:#F4EEFF; color:var(--plum-800)}
.side-foot{margin-top:auto; display:flex; flex-direction:column; gap:10px}
.role-tag{font-size:.82rem; color:#BBA9DD; padding:0 12px}
.side-user{display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:12px; background:rgba(255,255,255,.06); color:#fff; text-decoration:none}
.side-user small{display:block; color:#BBA9DD; font-size:.8rem}
.avatar::before{content:attr(data-i)}
.avatar{width:36px; height:36px; border-radius:50%; display:grid; place-items:center; font-weight:700; font-size:.9rem; flex:none; background:var(--gold); color:var(--plum-800)}
.avatar.lg{width:56px; height:56px; font-size:1.2rem}
.avatar.v{background:#CDB6FB} .avatar.g{background:#A7E3C9} .avatar.p{background:#F7B9C6} .avatar.b{background:#B5D4F7}
.main-col{min-width:0; display:flex; flex-direction:column}
.top{position:sticky; top:0; z-index:20; display:grid; grid-template-columns:44px minmax(0,1fr) auto; align-items:center; gap:12px; padding:12px clamp(16px,3vw,32px); background:color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter:blur(10px); border-bottom:1px solid var(--line)}
.top .back[hidden]{display:inline-grid; visibility:hidden}
.top-title{font-family:var(--font-display); font-weight:600; font-size:1.1rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.top-actions{display:flex; align-items:center; gap:4px}
.search-btn{display:inline-flex; align-items:center; gap:10px; height:40px; padding:0 12px; border-radius:12px; border:1px solid var(--line); background:var(--surface); color:var(--ink-3); cursor:pointer; margin-right:6px}
.search-btn kbd{font-family:inherit; font-size:.78rem; border:1px solid var(--line-strong); border-radius:6px; padding:1px 6px; color:var(--ink-2)}
.dot{position:absolute; top:9px; right:10px; width:9px; height:9px; border-radius:50%; background:var(--gold); border:2px solid var(--bg)}
main{padding:28px clamp(16px,3vw,40px) 64px; width:100%; max-width:1320px; margin-inline:auto; outline:none}
.page-head{display:flex; align-items:flex-end; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-bottom:24px}
.page-head p{color:var(--ink-2); margin-top:6px; max-width:62ch}
.bottom-nav{display:none}
.net-banner{display:flex; gap:12px; align-items:center; padding:12px clamp(16px,3vw,32px); background:var(--warn-soft); border-bottom:1px solid var(--line); font-size:.95rem}
.net-banner .code{color:var(--ink-3); font-size:.82rem}
.saved{display:inline-flex; align-items:center; gap:6px; font-size:.85rem; color:var(--ink-3)}
.saved svg.i{width:16px; height:16px; color:var(--ok)}

/* ---------- blocos ---------- */
.panel{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-lg); padding:22px}
.panel h2{margin-bottom:14px}
.panel-head{display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:14px}
.panel-head h2{margin:0}
.grid{display:grid; gap:20px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g-main{grid-template-columns:minmax(0,1.7fr) minmax(0,1fr)}
.muted{color:var(--ink-2)} .small{font-size:.88rem} .tiny{font-size:.8rem; color:var(--ink-3)}
.stack>*+*{margin-top:12px}
.row{display:flex; align-items:center; gap:10px; flex-wrap:wrap}
.spread{display:flex; align-items:center; justify-content:space-between; gap:8px 12px; flex-wrap:wrap}
.tag{display:inline-flex; align-items:center; gap:6px; padding:3px 10px; border-radius:999px; font-size:.82rem; font-weight:700; background:var(--violet-soft); color:var(--violet-ink)}
.tag.comp{background:#FCEBD2; color:#7A4A00}
:root[data-theme="escuro"] .tag.comp{background:#3A2C12; color:#F6C76E}
.tag.ok{background:var(--ok-soft); color:var(--ok)}
.tag.err{background:var(--err-soft); color:var(--err)}
.tag.neutral{background:var(--surface-2); color:var(--ink-2); border:1px solid var(--line)}
.progress{height:8px; border-radius:99px; background:var(--violet-soft); overflow:hidden}
.progress>span{display:block; height:100%; border-radius:99px; background:var(--violet)}
.progress.gold>span{background:var(--gold)}
.tabs{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:20px}
.tabs button{border:1px solid var(--line); background:var(--surface); padding:8px 16px; border-radius:999px; cursor:pointer; font-weight:700; color:var(--ink-2)}
.tabs button[aria-pressed="true"]{background:var(--plum-800); border-color:var(--plum-800); color:#fff}
:root[data-theme="escuro"] .tabs button[aria-pressed="true"]{background:var(--violet); color:#160827; border-color:var(--violet)}
.empty{text-align:center; padding:36px 20px; color:var(--ink-2)}
.empty h3{color:var(--ink); margin-bottom:6px}
.list{list-style:none; margin:0; padding:0}
.list>li{display:flex; align-items:center; gap:14px; padding:14px 0; border-top:1px solid var(--line)}
.list>li:first-child{border-top:0; padding-top:0}
.list .grow{flex:1; min-width:0}
.switch{position:relative; width:46px; height:26px; flex:none}
.switch input{appearance:none; -webkit-appearance:none; margin:0; width:46px; height:26px; border-radius:99px; background:var(--line-strong); cursor:pointer; transition:background .15s}
.switch input:checked{background:var(--violet)}
.switch input::after{content:""; position:absolute; top:3px; left:3px; width:20px; height:20px; border-radius:50%; background:#fff; transition:transform .15s}
.switch input:checked::after{transform:translateX(20px)}
.setting{display:flex; justify-content:space-between; align-items:center; gap:16px; padding:16px 0; border-top:1px solid var(--line)}
.setting:first-of-type{border-top:0}
.seg{display:inline-flex; border:1px solid var(--line-strong); border-radius:999px; padding:3px; background:var(--surface-2)}
.seg button{border:0; background:transparent; padding:6px 14px; border-radius:999px; cursor:pointer; font-weight:700; color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--violet); color:#fff}
:root[data-theme="escuro"] .seg button[aria-pressed="true"]{color:#160827}

/* ---------- início da aluna (rota) ---------- */
.hero{background:var(--plum-800); color:#F4EEFF; border-radius:28px; padding:clamp(24px,4vw,40px); display:grid; grid-template-columns:minmax(0,1fr) auto; gap:28px; align-items:end; position:relative; overflow:hidden}
.hero .hello{color:#CDB6FB; font-weight:700}
.hero h1{color:#fff; font-size:clamp(1.7rem,3vw,2.4rem); margin:6px 0 10px; max-width:20ch}
.hero p{color:#D9CCF2; max-width:52ch}
.hero .row{margin-top:22px}
.hero .btn-secondary{background:transparent; color:#fff; border-color:rgba(255,255,255,.35)}
.hero .btn-secondary:hover{border-color:#fff; color:#fff}
.route-line{display:flex; align-items:center; gap:0; margin-top:24px}
.route-line .stop{width:18px; height:18px; border-radius:50%; border:2px solid #8E73C4; background:var(--plum-800); flex:none; position:relative}
.route-line .stop.done{background:#CDB6FB; border-color:#CDB6FB}
.route-line .stop.now{background:var(--gold); border-color:var(--gold); box-shadow:0 0 0 6px rgba(241,178,74,.25)}
.route-line .seg-l{height:2px; flex:1; min-width:6px; background:#6D57A0}
.hero>*, .course-hero>*{min-width:0}
.hero .btn, .course-hero .btn{white-space:normal; text-align:left}
.route-line .seg-l.done{background:#CDB6FB}
.hero-stat{text-align:right}
.hero-stat strong{display:block; font-family:var(--font-display); font-size:2.6rem; color:var(--gold); line-height:1}
.hero-stat span{color:#CDB6FB; font-size:.9rem}
.mini-bars{display:flex; align-items:flex-end; gap:8px; height:96px; margin-top:10px}
.mini-bars div{flex:1; display:flex; flex-direction:column; align-items:center; gap:6px; height:100%; justify-content:flex-end}
.mini-bars i{display:block; width:100%; max-width:28px; border-radius:8px 8px 4px 4px; background:var(--violet-soft)}
.mini-bars i.on{background:var(--violet)}
.mini-bars i.today{background:var(--gold)}
.mini-bars small{font-size:.75rem; color:var(--ink-3)}

/* ---------- trilhas ---------- */
.trail-card{display:flex; flex-direction:column; gap:12px; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-lg); padding:20px; text-decoration:none; color:inherit}
.trail-card:hover{border-color:var(--violet)}
.trail-card h3{font-size:1.1rem}
.trail-card .meta{display:flex; gap:14px; color:var(--ink-3); font-size:.88rem; flex-wrap:wrap}
.trail-card .meta span{display:inline-flex; gap:5px; align-items:center}
.trail-card .meta svg.i{width:16px; height:16px}
.trail-card .foot{display:flex; align-items:center; gap:12px; margin-top:auto}
.trail-card .foot .progress{flex:1}
.search-field{position:relative; max-width:360px; width:100%}
.search-field svg.i{position:absolute; left:14px; top:13px; color:var(--ink-3)}
.search-field .input{padding-left:44px}

.trail-head{display:grid; grid-template-columns:minmax(0,1fr) 220px; gap:24px; align-items:end; margin-bottom:28px}
.path{list-style:none; margin:0; padding:0; position:relative}
.path>li{display:grid; grid-template-columns:48px minmax(0,1fr) auto; gap:16px; align-items:center; padding:12px 0; position:relative}
.path>li::before{content:""; position:absolute; left:23px; top:0; bottom:0; width:2px; background:var(--line-strong)}
.path>li:first-child::before{top:50%} .path>li:last-child::before{bottom:50%}
.path>li.done::before{background:var(--violet)}
.node{width:48px; height:48px; border-radius:50%; display:grid; place-items:center; position:relative; z-index:1; background:var(--surface); border:2px solid var(--line-strong); color:var(--ink-3); font-family:var(--font-display); font-weight:600}
.done .node{background:var(--violet); border-color:var(--violet); color:#fff}
.now .node{background:var(--gold); border-color:var(--gold); color:var(--plum-800)}
.locked .node{background:var(--surface-2)}
.path .step-body{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:14px 16px}
.path .now .step-body{border-color:var(--gold); box-shadow:var(--shadow)}
.path .locked .step-body{background:var(--surface-2); border-style:dashed}
.path .step-body strong{display:block}

/* etapa */
.lesson{display:grid; grid-template-columns:minmax(0,1fr) 300px; gap:24px; align-items:start}
.lesson>*, .grid>*, .g-main>*{min-width:0}
.lesson-body{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-lg); padding:clamp(20px,3vw,36px)}
.lesson-body h1{font-size:1.7rem; margin:8px 0 6px}
.lesson-body .text p{margin-top:14px; max-width:68ch; font-size:1.05rem}
pre.code{background:var(--plum-900); color:#EDE4FF; border-radius:var(--radius); padding:16px 18px; overflow:auto; font-family:ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; font-size:.9rem; line-height:1.6; margin:16px 0 0}
code.inline{font-family:ui-monospace, Menlo, Consolas, monospace; background:var(--violet-soft); color:var(--violet-ink); padding:1px 6px; border-radius:6px; font-size:.9em}
.quiz{margin-top:28px; padding:20px; border-radius:var(--radius); background:var(--surface-2); border:1px solid var(--line)}
.quiz h3{margin-bottom:12px}
.opt{display:flex; gap:12px; align-items:center; padding:12px 14px; border:1.5px solid var(--line); border-radius:var(--radius); margin-top:10px; cursor:pointer; background:var(--surface)}
.opt:hover{border-color:var(--violet)}
.opt input{accent-color:var(--violet); width:18px; height:18px}
.opt.right{border-color:var(--ok); background:var(--ok-soft)}
.opt.wrong{border-color:var(--err); background:var(--err-soft)}
.lesson-nav{display:flex; justify-content:space-between; gap:12px; margin-top:28px; flex-wrap:wrap}
.aside-box{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-lg); padding:18px}
.aside-box+.aside-box{margin-top:16px}
.aside-box h3{margin-bottom:8px}

/* chat */
.chat{display:flex; flex-direction:column; height:calc(100vh - 69px - 28px - 64px); min-height:480px; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-lg); overflow:hidden}
.chat-head{display:flex; align-items:center; gap:12px; padding:14px 18px; border-bottom:1px solid var(--line)}
.bot-mark{width:40px; height:40px; border-radius:12px; background:var(--plum-800); color:var(--gold); display:grid; place-items:center; flex:none}
.msgs{flex:1; overflow:auto; padding:20px 18px; display:flex; flex-direction:column; gap:12px}
.msg{max-width:min(620px,86%); padding:12px 16px; border-radius:18px; line-height:1.5}
.msg.me{align-self:flex-end; background:var(--violet); color:#fff; border-bottom-right-radius:6px}
:root[data-theme="escuro"] .msg.me{color:#160827}
.msg.them{align-self:flex-start; background:var(--surface-2); border:1px solid var(--line); border-bottom-left-radius:6px}
.msg.warn{border-color:color-mix(in srgb, var(--err) 40%, transparent); background:var(--err-soft)}
.msg pre.code{margin:10px 0 0; font-size:.85rem}
.msg .when{display:block; font-size:.75rem; margin-top:4px; color:var(--ink-2)}
.msg.me .when{color:inherit}
.msg p+p{margin-top:8px}
.chips{display:flex; flex-wrap:wrap; gap:8px}
.chip{border:1px solid var(--line-strong); background:var(--surface); color:var(--violet-ink); padding:7px 14px; border-radius:999px; cursor:pointer; font-weight:700; font-size:.9rem}
.chip:hover{border-color:var(--violet); background:var(--violet-soft)}
.composer{display:flex; gap:10px; align-items:flex-end; padding:14px 16px; border-top:1px solid var(--line)}
.composer textarea{min-height:46px; max-height:160px; resize:none}
.typing{display:inline-flex; gap:4px}
.typing i{width:7px; height:7px; border-radius:50%; background:var(--ink-3); animation:blink 1s infinite}
.typing i:nth-child(2){animation-delay:.15s} .typing i:nth-child(3){animation-delay:.3s}
@keyframes blink{0%,100%{opacity:.25}50%{opacity:1}}
.context-chip{display:inline-flex; align-items:center; gap:6px; padding:4px 6px 4px 12px; border-radius:999px; background:var(--violet-soft); color:var(--violet-ink); font-size:.85rem; font-weight:700}
.context-chip button{border:0; background:transparent; cursor:pointer; color:inherit; display:grid; place-items:center; width:24px; height:24px; border-radius:50%}
.convs{display:grid; grid-template-columns:280px minmax(0,1fr); gap:16px}
.conv-list{min-width:0; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-lg); padding:8px; align-self:start}
.conv-list a{display:flex; gap:12px; align-items:center; padding:10px; border-radius:12px; text-decoration:none; color:inherit}
.conv-list a:hover{background:var(--surface-2)}
.conv-list a[aria-current="page"]{background:var(--violet-soft)}
.conv-list .grow{min-width:0; flex:1}
.conv-list small{display:block; color:var(--ink-3); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}

/* progresso */
.stat{padding:18px 20px; border-radius:var(--radius-lg); background:var(--surface); border:1px solid var(--line)}
.stat strong{display:block; font-family:var(--font-display); font-size:1.9rem; font-weight:600; line-height:1.1}
.stat span{color:var(--ink-2); font-size:.92rem}
.stat.feature{background:var(--plum-800); border-color:var(--plum-800); color:#fff}
.stat.feature strong{color:var(--gold)} .stat.feature span{color:#CDB6FB}
.badges{list-style:none; margin:0; padding:0; display:grid; grid-template-columns:repeat(auto-fill,minmax(130px,1fr)); gap:12px}
.badge{text-align:center; padding:16px 10px; border-radius:var(--radius); border:1px solid var(--line); background:var(--surface-2)}
.badge .b-icon{width:52px; height:52px; margin:0 auto 8px; border-radius:50%; display:grid; place-items:center; background:var(--gold); color:var(--plum-800)}
.badge.off{background:transparent; border-style:dashed} .badge.off .b-icon{background:var(--line); color:var(--ink-2)}
.badge strong{display:block; font-size:.9rem}
.rank li{gap:12px}
.rank .pos{width:28px; font-family:var(--font-display); font-weight:600; color:var(--ink-3); text-align:center}
.rank li.me{background:var(--violet-soft); border-radius:12px; padding-left:8px; padding-right:8px}
.chart svg{width:100%; height:auto; display:block}

/* mentoria */
.mentor-card{display:grid; grid-template-columns:auto minmax(0,1fr) auto; gap:16px; align-items:center; padding:18px; border:1px solid var(--line); border-radius:var(--radius-lg); background:var(--surface)}
.week{display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:10px}
.week .day{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:12px}
.week .day h3{font-size:.95rem; margin-bottom:10px; text-transform:capitalize}
.slot{display:block; width:100%; margin-top:8px; padding:10px; border-radius:10px; border:1.5px solid var(--line-strong); background:var(--surface-2); cursor:pointer; font-weight:700; color:var(--violet-ink)}
.slot:hover{border-color:var(--violet); background:var(--violet-soft)}
.slot[disabled]{cursor:not-allowed; color:var(--ink-3); text-decoration:line-through; background:transparent; border-style:dashed}
.slot.sel{background:var(--violet); color:#fff; border-color:var(--violet)}
.avail-grid{display:grid; grid-template-columns:72px repeat(5,minmax(0,1fr)); gap:6px; align-items:center}
.avail-grid .h{font-weight:700; text-align:center; font-size:.9rem; color:var(--ink-2)}
.avail-grid .t{font-size:.9rem; color:var(--ink-2)}
.avail-grid button{height:40px; border-radius:10px; border:1.5px dashed var(--line-strong); background:transparent; cursor:pointer; color:var(--ink-3); font-weight:700; font-size:.82rem}
.avail-grid button[aria-pressed="true"]{background:var(--violet); border:1.5px solid var(--violet); color:#fff}
.avail-grid button.booked{background:var(--gold); border:1.5px solid var(--gold); color:var(--plum-800); cursor:default}

/* tabelas (admin) */
.table-wrap{overflow:auto; border:1px solid var(--line); border-radius:var(--radius-lg); background:var(--surface)}
table.t{width:100%; border-collapse:collapse; min-width:640px}
table.t th{text-align:left; font-size:.85rem; color:var(--ink-2); font-weight:700; padding:12px 16px; background:var(--surface-2); border-bottom:1px solid var(--line)}
table.t td{padding:12px 16px; border-top:1px solid var(--line); vertical-align:middle}
table.t tr:first-child td{border-top:0}
.step-row{display:grid; grid-template-columns:36px minmax(0,1fr) auto; gap:12px; align-items:center; padding:12px 14px; border:1px solid var(--line); border-radius:var(--radius); background:var(--surface); margin-top:10px}
.step-row .num{width:32px; height:32px; border-radius:50%; background:var(--violet-soft); color:var(--violet-ink); display:grid; place-items:center; font-weight:700}

/* modal, toast, menus */
.overlay{position:fixed; inset:0; background:rgba(22,8,39,.55); display:grid; place-items:center; padding:20px; z-index:60; animation:fade .15s ease-out}
.modal{background:var(--surface); border-radius:24px; width:100%; max-width:520px; max-height:90vh; overflow:auto; padding:28px; box-shadow:0 30px 80px -20px rgba(0,0,0,.5); animation:pop .18s ease-out}
.modal.wide{max-width:640px}
.modal h2{margin-bottom:8px}
.modal .actions{display:flex; justify-content:flex-end; gap:10px; margin-top:24px; flex-wrap:wrap}
@keyframes fade{from{opacity:0}} @keyframes pop{from{opacity:0; transform:translateY(8px) scale(.98)}}
.toasts{position:fixed; bottom:24px; right:24px; display:flex; flex-direction:column; gap:10px; z-index:80; width:min(420px, calc(100vw - 32px))}
.toast{display:flex; align-items:center; gap:12px; background:var(--plum-900); color:#F4EEFF; padding:12px 14px 12px 16px; border-radius:14px; box-shadow:0 16px 40px -12px rgba(0,0,0,.45); animation:pop .18s ease-out}
.toast svg.i{color:var(--gold)}
.toast .grow{flex:1}
.toast button{background:transparent; border:0; color:var(--gold); font-weight:700; cursor:pointer; padding:6px 8px; border-radius:8px}
.toast button:hover{background:rgba(255,255,255,.08)}
.menu{position:absolute; right:0; top:52px; width:340px; background:var(--surface); border:1px solid var(--line); border-radius:18px; box-shadow:var(--shadow); padding:8px; z-index:40}
.menu h3{padding:10px 12px 6px; font-size:.95rem}
.menu .item{display:flex; gap:12px; padding:10px 12px; border-radius:12px}
.menu .item:hover{background:var(--surface-2)}
.menu .item svg.i{color:var(--violet); margin-top:2px}
.anchor{position:relative}
.palette{max-width:580px; padding:0; overflow:hidden; align-self:start; margin-top:10vh}
.palette .input{border:0; border-bottom:1px solid var(--line); border-radius:0; min-height:58px; padding:0 20px 0 52px; font-size:1.05rem; box-shadow:none}
.palette .search-field{max-width:none}
.palette .search-field svg.i{top:19px; left:20px}
.palette ul{list-style:none; margin:0; padding:8px; max-height:360px; overflow:auto}
.palette li a{display:flex; gap:12px; align-items:center; padding:10px 12px; border-radius:12px; text-decoration:none; color:inherit}
.palette li a:hover, .palette li a:focus{background:var(--violet-soft); outline:none}
.palette .foot{padding:10px 16px; border-top:1px solid var(--line); font-size:.82rem; color:var(--ink-3)}
.kbd-list{display:grid; grid-template-columns:auto 1fr; gap:10px 16px; align-items:center}
.kbd-list kbd{font-family:inherit; font-weight:700; border:1px solid var(--line-strong); border-bottom-width:3px; border-radius:8px; padding:2px 8px; font-size:.85rem; justify-self:start}
.onb-steps{display:flex; gap:6px; margin-bottom:18px}
.onb-steps i{height:6px; flex:1; border-radius:99px; background:var(--line)}
.onb-steps i.on{background:var(--violet)}
.choice{display:flex; gap:12px; align-items:flex-start; padding:14px; border:1.5px solid var(--line); border-radius:var(--radius); cursor:pointer; margin-top:10px}
.choice:has(input:checked){border-color:var(--violet); background:var(--violet-soft)}
.choice input{accent-color:var(--violet); margin-top:4px}


/* ---------- v2: logotipo animado ---------- */
.logo{display:inline-flex; align-items:center; gap:10px}
.logo-mark{display:block; flex:none; overflow:visible}
.logo-word{font-family:var(--font-display); font-weight:700; font-size:1.4rem; letter-spacing:-.02em}
.logo .stop, .logo .spark, .logo .halo{transform-box:fill-box; transform-origin:center}
.logo .spark{animation:twinkle 3.6s 1.5s ease-in-out infinite}
.logo .halo{animation:halo 3.6s 1.5s ease-in-out infinite}
.logo.intro .trail{stroke-dasharray:50 80; stroke-dashoffset:55; animation:draw .9s .15s cubic-bezier(.6,.1,.3,1) forwards}
.logo.intro .t2{stroke-dasharray:11 40; stroke-dashoffset:16; animation-duration:.4s; animation-delay:.75s}
.logo.intro .spark{transform:scale(0); animation:popin .45s 1.1s cubic-bezier(.3,1.6,.5,1) forwards, twinkle 3.6s 2.2s ease-in-out infinite}
.brand:hover .spark{animation:popin .45s cubic-bezier(.3,1.6,.5,1) forwards, spin 1s ease-in-out}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes popin{to{transform:scale(1)}}
@keyframes twinkle{0%,100%{transform:scale(1) rotate(0)}12%{transform:scale(1.25) rotate(20deg)}24%{transform:scale(1) rotate(0)}}
@keyframes halo{0%,100%{opacity:.28; transform:scale(1)}12%{opacity:.5; transform:scale(1.35)}24%{opacity:.28; transform:scale(1)}}
@keyframes spin{to{transform:scale(1) rotate(360deg)}}
.brand{display:flex; align-items:center; text-decoration:none; color:inherit; border-radius:12px}
.brand-light{color:#fff}
.art-halo{transform-box:fill-box; transform-origin:center; animation:halo 4s 1s ease-in-out infinite}
:root.reduz-mov *, :root.reduz-mov *::before{animation:none!important; transition:none!important}
:root.reduz-mov .logo .trail{stroke-dashoffset:0!important} :root.reduz-mov .logo .stop, :root.reduz-mov .logo .spark{transform:none!important}
@media (prefers-reduced-motion:reduce){ .logo .trail{stroke-dashoffset:0!important} .logo .stop, .logo .spark{transform:none!important} }

/* ---------- v2: estrutura ---------- */
.nav a{position:relative}
.nav-badge{min-width:22px; height:22px; padding:0 6px; border-radius:99px; background:var(--gold); color:var(--plum-800); font-size:.78rem; font-weight:700; display:inline-grid; place-items:center}
.nav a[aria-current="page"] .nav-badge{background:var(--plum-800); color:#fff}
.side-user{display:flex; align-items:center; gap:10px; padding:8px 6px 8px 12px; border-radius:12px; background:rgba(255,255,255,.06); color:#fff}
.side-user a{color:#fff; text-decoration:none; min-width:0; font-weight:700; line-height:1.25}
.side-user a:hover{text-decoration:underline}
.side-user small{display:block; color:#CDBDEA; font-size:.8rem; font-weight:400}
.side-out{color:#E7DDF9; width:40px; height:40px}
.side-out:hover{background:rgba(255,255,255,.12); color:#fff}
.role-tag{color:#CDBDEA}
.count{position:absolute; top:4px; right:4px; min-width:18px; height:18px; padding:0 5px; border-radius:99px; background:var(--gold); color:var(--plum-800); font-size:.72rem; font-weight:700; display:grid; place-items:center; border:2px solid var(--bg)}
.avatar-btn{border:0; background:transparent; padding:4px; border-radius:50%; cursor:pointer; display:grid; place-items:center; width:44px; height:44px}
.avatar-btn:hover{background:var(--violet-soft)}
.menu .item{display:flex; gap:12px; padding:10px 12px; border-radius:12px; text-decoration:none; color:inherit; width:100%; border:0; background:transparent; text-align:left; cursor:pointer; font:inherit}
.menu .item.unread{background:var(--violet-soft)}
.menu .item{position:relative}
.menu .item.unread::after{content:""; position:absolute; top:16px; right:12px; width:8px; height:8px; border-radius:50%; background:var(--violet)}
.menu .item.unread>div{padding-right:14px}
.menu-sm{width:250px}
.menu .item svg.i{flex:none}
.bn-ic{position:relative; display:inline-grid}
.bn-dot{position:absolute; top:-2px; right:-4px; width:9px; height:9px; border-radius:50%; background:var(--gold)}
.pron{font-size:.8rem; font-weight:400; color:var(--ink-3); margin-left:4px; white-space:nowrap}
.cap{text-transform:none} .cap::first-letter{text-transform:uppercase}
.strong{font-weight:700}
.strong-link{font-weight:700; text-decoration:none}
.strong-link:hover{text-decoration:underline}
.linkish{background:none; border:0; padding:0; color:var(--violet); text-decoration:underline; cursor:pointer; font-size:inherit}
.danger-text{color:var(--err)}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.fs{border:0; margin:0; padding:0; min-width:0}
.fs legend{padding:0; font-weight:700; margin-bottom:4px}
.fs.box{border:1px solid var(--line); border-radius:var(--radius); padding:12px 14px 0; margin-bottom:16px}
.fs.box legend{padding:0 6px}
.select-sm{width:auto; min-height:40px}
.note-box{display:flex; gap:8px; align-items:flex-start; margin-top:8px; padding:8px 10px; border-radius:10px; background:var(--surface-2); border:1px solid var(--line)}
.note-box svg.i{width:16px; height:16px; margin-top:3px; color:var(--violet)}
.panel-attn{border-color:var(--gold); box-shadow:0 0 0 3px color-mix(in srgb, var(--gold) 25%, transparent)}
.legend{display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-top:14px}
.avail-wrap{overflow-x:auto}
.avail-grid{min-width:460px}
.h3{font-size:1.05rem}
.tag.light{background:rgba(255,255,255,.14); color:#fff}
.chip.on{background:var(--violet); color:#fff; border-color:var(--violet)}
.chip svg.i{width:16px; height:16px; margin-right:4px; vertical-align:-3px}
.chat-title{font-size:1rem; font-weight:700; font-family:var(--font-body); letter-spacing:0}
.mat-card{display:flex; gap:10px; align-items:center; padding:10px 12px; border-radius:12px; background:rgba(255,255,255,.14); color:inherit; text-decoration:none; margin-bottom:6px}
.msg.them .mat-card{background:var(--violet-soft)}
.mat-card span{display:flex; flex-direction:column}
.settings-cols{columns:2 400px; column-gap:20px}
.settings-cols>*{break-inside:avoid; display:block; margin:0 0 20px; width:100%}
.setting>div:first-child{flex:1 1 220px}
.stack>*+*{margin-top:12px}
.sug svg.i{color:var(--violet); margin-top:3px}

/* contraste do texto sobre roxo no tema escuro */
.avail-grid button[aria-pressed="true"], .slot.sel, .chip.on, .ol-i.ok, .done .node, .seg button[aria-pressed="true"], .nav a[aria-current="page"] .nav-badge{color:var(--on-violet)}
.opt svg.i{width:18px; height:18px}
.opt.right svg.i{color:var(--ok)} .opt.wrong svg.i{color:var(--err)}
/* ---------- v2: cartões e página de trilha ---------- */
.trail-card{position:relative}
.trail-card h3 a{color:inherit; text-decoration:none}
.trail-card .stretch::after{content:""; position:absolute; inset:0; border-radius:var(--radius-lg)}
.trail-card:focus-within{outline:3px solid var(--gold); outline-offset:2px}
.trail-card .stretch:focus-visible{outline:none}
.trail-cover{height:84px; border-radius:14px; margin:-6px -6px 4px; display:grid; place-items:center; background:linear-gradient(135deg,#5B21B6,#2A0E4A); color:#F1B24A; overflow:hidden; position:relative}
.trail-cover::before{content:""; position:absolute; inset:0; background:radial-gradient(circle at 85% 20%, rgba(241,178,74,.35), transparent 40%), repeating-linear-gradient(115deg, rgba(255,255,255,.05) 0 2px, transparent 2px 14px)}
.trail-cover.comportamental{background:linear-gradient(135deg,#8E3B6E,#3A1563)}
.trail-cover.inicial{background:linear-gradient(135deg,#3A1563,#160827)}
.trail-cover span{position:relative; width:48px; height:48px; border-radius:14px; display:grid; place-items:center; background:rgba(255,255,255,.12)}
.trail-cover svg.i{width:26px; height:26px}
.course-hero{background:linear-gradient(135deg,#3A1563 0%,#2A0E4A 60%,#1F0B37 100%); color:#F4EEFF; border-radius:28px; padding:clamp(22px,4vw,40px); display:grid; grid-template-columns:minmax(0,1fr) 280px; gap:28px; align-items:end; position:relative; overflow:hidden}
.course-hero.comportamental{background:linear-gradient(135deg,#6B2D5C 0%,#3A1563 60%,#1F0B37 100%)}
.course-hero h1{color:#fff; font-size:clamp(1.7rem,3vw,2.4rem); margin:14px 0 10px}
.course-hero>div>p{color:#E1D5F7; max-width:60ch}
.course-meta{list-style:none; padding:0; margin:18px 0 0; display:flex; flex-wrap:wrap; gap:8px 18px; color:#E1D5F7; font-size:.92rem}
.course-meta li{display:flex; align-items:center; gap:6px}
.course-meta svg.i{width:18px; height:18px; color:var(--gold)}
.curator{display:flex; align-items:center; gap:10px; margin-top:18px; color:#E1D5F7; font-size:.92rem}
.curator strong{color:#fff}
.course-progress{background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.14); border-radius:20px; padding:18px}
.course-progress p{color:#E1D5F7}
.course-progress p strong{font-family:var(--font-display); font-size:2rem; color:var(--gold)}
.course-progress .progress{margin:10px 0 6px; background:rgba(255,255,255,.15)}
.course-progress .btn{width:100%; margin-top:14px}
.checks{list-style:none; padding:0; margin:0; display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px 18px}
.checks li{display:flex; gap:10px; align-items:flex-start}
.checks svg.i{color:var(--ok); margin-top:2px}
.module{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-lg); padding:16px 18px 6px; margin-top:14px}
.module h3{display:flex; justify-content:space-between; align-items:baseline; gap:12px; margin-bottom:6px}
.refs{list-style:none; padding:0; margin:0; display:flex; flex-direction:column; gap:12px}
.refs li{display:flex; gap:10px; font-size:.88rem; line-height:1.45}
.refs svg.i{width:18px; height:18px; color:var(--violet); margin-top:2px}
.cert{border:2px solid var(--gold); border-radius:18px; padding:32px 24px; text-align:center; background:linear-gradient(180deg,var(--surface),var(--violet-soft))}
.cert-logo{display:flex; justify-content:center; margin-bottom:14px; color:var(--ink)}
.cert-name{font-family:var(--font-display); font-size:1.8rem; font-weight:600; margin:6px 0}
.cert-t{font-family:var(--font-display); font-size:1.2rem; color:var(--violet-ink); margin:6px 0}

/* ---------- v2: etapa com vídeo e abas ---------- */
.player{margin:20px 0 6px; border-radius:18px; overflow:hidden; background:#160827; color:#fff}
.player:focus-visible{outline:3px solid var(--gold); outline-offset:3px}
.screen{position:relative; aspect-ratio:16/9; display:grid; place-items:center; cursor:pointer; background:radial-gradient(circle at 80% 15%, rgba(241,178,74,.25), transparent 35%), linear-gradient(135deg,#3A1563,#160827)}
.screen-art{position:absolute; inset:0; display:flex; flex-direction:column; justify-content:flex-start; padding:18px 20px}
.scr-tag{font-family:var(--font-display); font-weight:600; font-size:clamp(1rem,2.4vw,1.5rem); max-width:70%; color:#fff; line-height:1.2}

.controls{display:flex; align-items:center; gap:8px; padding:8px 10px; background:#1F0B37}

function bizDays(n){
  const out=[]; const d=new Date(); d.setHours(0,0,0,0);
  while(out.length<n){ d.setDate(d.getDate()+1); const w=d.getDay(); if(w>0&&w<6) out.push(new Date(d)); }
  return out;
}

const fmtDay = iso => pDate(iso).toLocaleDateString('pt-BR',{weekday:'long', day:'2-digit', month:'2-digit'});
const fmtShort = iso => pDate(iso).toLocaleDateString('pt-BR',{weekday:'short', day:'2-digit', month:'2-digit'}).replace('.', '');

function me(){ return S.users.find(u => u.id === S.session) || null; }
function user(id){ return S.users.find(u => u.id === id); }
function mentor(id){ const u = user(id); const p = S.mprof[id]; return (u && p) ? Object.assign({id, nome:u.nome, pron:u.pron}, p) : null; }
function mentorsList(){ return S.users.filter(u => u.role==='mentoria' && u.status==='ativo' && S.mprof[u.id]).map(u => mentor(u.id)); }
function trilha(id){ return S.trilhas.find(t => t.id === id); }
function etapaById(eid){ for(const t of S.trilhas){ const i=t.etapas.findIndex(e=>e.id===eid); if(i>=0) return {t, e:t.etapas[i], i}; } return null; }
function done(uidv){ return S.progress[uidv] || (S.progress[uidv] = {}); }
function stats(t, uidv){ const d=done(uidv); const n=t.etapas.filter(e=>d[e.id]).length; const total=t.etapas.length||1; return {n, total:t.etapas.length, pct:Math.round(n/total*100)}; }
function points(uidv){ return Object.keys(done(uidv)).length*20 + (S.extraPoints[uidv]||0); }
function nextEtapa(t, uidv){ return t.etapas.find(e => !done(uidv)[e.id]); }
function visibleTrilhas(){ return S.trilhas.filter(t => t.status === 'publicada' && t.etapas.length); }
function currentTrilha(uidv){
  const ts = visibleTrilhas();
  const going = ts.filter(t => { const s=stats(t,uidv); return s.n>0 && s.n<s.total; }).sort((a,b)=>stats(b,uidv).pct-stats(a,uidv).pct);
  return going.find(t=>t.cat==='tecnica') || going[0] || ts.find(t=>stats(t,uidv).n<stats(t,uidv).total) || ts[0];
}
function isLocked(t, i, uidv){ const d=done(uidv); return i>0 && !d[t.etapas[i-1].id] && !d[t.etapas[i].id]; }
function offline(){ return UI.netDown || S.offlineDemo; }
function roleHome(role){ return role==='mentoria' ? '/mentor/agenda' : role==='admin' ? '/admin/visao' : '/inicio'; }
function roleName(role){ return role==='mentoria' ? 'Pessoa mentora' : role==='admin' ? 'Administração' : 'Estudante'; }
function prefs(id){ const u = id ? user(id) : me(); if(!u) return {}; return S.prefs[u.id] || (S.prefs[u.id] = JSON.parse(JSON.stringify(DEFAULT_PREFS[u.role]||{}))); }
function notify(to, icon, t, d, link){ (S.notifs[to] ||= []).unshift({id:uid(), icon, t, d, link, read:false}); }
function avatarColor(id){ const c=['v','g','p','b','']; let h=0; for(const ch of String(id)) h=(h+ch.charCodeAt(0))%c.length; return c[h]; }
function av(name, id, cls=''){ return `<span class="avatar ${avatarColor(id||name)} ${cls}" data-i="${esc(initials(name))}" aria-hidden="true"></span>`; }
function pron(u){ return u && u.pron && u.pron!=='—' ? ` <span class="pron">${esc(u.pron)}</span>` : ''; }
function progress(pct, cls=''){ return `<div class="progress ${cls}" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${pct}" aria-label="${pct}% concluído"><span style="width:${pct}%"></span></div>`; }
const pl = (n, s, p) => `${n} ${n===1?s:p}`;

/* ---------- avisos com desfazer ---------- */
function toast(msg, opts={}){
  const box = $('#toasts'); if(!box) return;
  const el = document.createElement('div'); el.className='toast'; el.setAttribute('role','status');
  el.innerHTML = icon(opts.icon||'check') + `<div class="grow">${esc(msg)}</div>` + (opts.undo ? `<button type="button" data-undo>Desfazer</button>` : '') + `<button type="button" aria-label="Fechar aviso" data-x>${icon('x')}</button>`;
  const kill = () => { el.remove(); };
  el.querySelector('[data-x]').onclick = kill;
  if(opts.undo) el.querySelector('[data-undo]').onclick = () => { kill(); opts.undo(); };
  box.appendChild(el);
  while(box.children.length > 3) box.firstChild.remove();
  let left = opts.undo ? 8000 : 5000, start = Date.now(), timer = setTimeout(kill, left);
  const pause = () => { clearTimeout(timer); left -= Date.now() - start; };
  const resume = () => { start = Date.now(); timer = setTimeout(kill, Math.max(1500, left)); };
  el.addEventListener('mouseenter', pause); el.addEventListener('mouseleave', resume);
  el.addEventListener('focusin', pause); el.addEventListener('focusout', resume);
}

function hashPath(){ try{ return (location.hash || '').replace(/^#/,''); }catch(e){ return ''; } }
let ROUTE = hashPath() || '/';
function currentPath(){ return (ROUTE || '/').split('?')[0]; }
function setUrl(path){ try{ if(hashPath() !== path) history.pushState(null, '', '#'+path); }catch(e){} }
function onRoute(){ stopVideo(); UI.err = {}; UI.alert = {}; UI.menu = null; UI.sel = null; render(); window.scrollTo(0,0); const m=$('#main'); if(m) m.focus({preventScroll:true}); }
function match(path){
  const parts = path.split('/').filter(Boolean);
  for(const r of ROUTES){
    const rp = r.p.split('/').filter(Boolean);
    if(rp.length !== parts.length) continue;
    const params = {}; let ok = true;
    rp.forEach((seg,i) => { if(seg[0]===':') params[seg.slice(1)] = decodeURIComponent(parts[i]); else if(seg !== parts[i]) ok = false; });
    if(ok) return {r, params};
  }
  return null;
}
function go(path){ if(currentPath() === path){ render(); return; } ROUTE = path; setUrl(path); onRoute(); }

function applyPrefs(){

  root.dataset.theme = theme;
  root.style.setProperty('--fs', st.fs);

}

const $app = document.getElementById('app');
function render(){
  applyPrefs();
  const path = currentPath();
  const u = me();
  let m = match(path);
  if(!m){ go(u ? roleHome(u.role) : '/login'); return; }
  if(m.r.pub && u){ go(roleHome(u.role)); return; }
  if(!m.r.pub && !u){ go('/login'); return; }
  if(!m.r.pub && m.r.role !== '*' && m.r.role !== u.role){ go(roleHome(u.role)); return; }
  const out = m.r.v(m.params) || {html:''};
  if(out.redirect){ go(out.redirect); return; }
  document.title = (out.title ? out.title + ' | ' : '') + 'Eliz';

}

  const root = $('#modal-root'); if(!root) return;

function paletteData(){
  const u = me(); if(!u) return [];
  const items = navFor(u).map(([p,l,i]) => ({p, l, i, s:'Ir para'}));
  items.push({p:'/configuracoes', l:'Configurações', i:'settings', s:'Ir para'});
  if(u.role==='estudante'){
    visibleTrilhas().forEach(t => { items.push({p:'/trilhas/'+t.id, l:t.titulo, i:'map', s:'Trilha'}); t.etapas.forEach((e,i)=>{ if(!isLocked(t,i,u.id)) items.push({p:`/trilhas/${t.id}/${e.id}`, l:e.titulo, i:'book', s:t.titulo}); }); });
    mentorsList().forEach(m => items.push({p:'/mentoria/agendar/'+m.id, l:'Pedir mentoria com '+m.nome, i:'calendar', s:'Mentoria'}));

  if(u.role==='admin') S.trilhas.forEach(t => items.push({p:'/admin/trilhas/'+t.id, l:'Editar: '+t.titulo, i:'edit', s:'Trilha'}));

function paletteItems(q){

  if(!res.length) return `<li class="empty small">Nada encontrado para “${esc(q)}”. Tente outra palavra.</li>`;
  return res.map(it => `<li><a href="#${it.p}" data-act="closeModalNav">${icon(it.i)}<span style="flex:1">${esc(it.l)}</span><span class="tiny">${esc(it.s)}</span></a></li>`).join('');
}

const ACT = {};

document.addEventListener('click', e => {
  if(UI.menu && !e.target.closest('.menu') && !e.target.closest('[data-act="menu"]')){ UI.menu = null; render(); }
  const link = e.target.closest('a[href^="#"]');
  if(link && !link.dataset.act){
    if(e.ctrlKey || e.metaKey || e.shiftKey || e.button === 1) return;
    e.preventDefault();
    const h = link.getAttribute('href').slice(1);
    if(h === 'main'){ $('#main')?.focus(); return; }
    if(UI.menu){ UI.menu = null; }
    if(h) go(h);
    return;
  }
  const el = e.target.closest('[data-act]'); if(!el) return;
  const act = el.dataset.act;
  if(act === 'overlay' && e.target !== el) return;
  if(ACT[act]){ if(el.tagName==='BUTTON' || el.tagName==='A' || el.dataset.prevent !== undefined) { if(!(el.tagName==='INPUT')) e.preventDefault(); } ACT[act](el, e); }
});

  e.preventDefault();
  const vals = Object.fromEntries(new FormData(f).entries());

document.addEventListener('keydown', e => {

  {k:['variave','tipo de dado','tipos de dado','string','inteiro'], r:'Uma **variável** guarda um valor com um nome, para você usar depois.\n\n```\nnome = "Ana"      # texto (string)\nidade = 21        # inteiro (int)\naltura = 1.65     # decimal (float)\naprovada = True   # verdadeiro ou falso (bool)\n```\n\nDica: escolha nomes que digam o que a variável guarda.'},

  {k:['laco','lacos','loop','for','while','repeticao','repetir'], r:'Laços repetem um bloco de código.\n\n**for**: quando você sabe quantas vezes repetir (ou quer percorrer uma lista).\n**while**: quando você repete enquanto uma condição for verdadeira.\n\n```\nfor i in range(3):\n    print(i)        # 0, 1, 2\n\nx = 0\nwhile x < 3:\n    x = x + 1\n```\n\nCuidado: no while, algo precisa mudar a condição, senão o laço não termina.'},
  {k:['funcao','funcoes','def ','return','parametro'], r:'Uma **função** é um bloco de código com nome que você pode chamar várias vezes.\n\n```\ndef saudacao(nome):\n    return "Oi, " + nome\n\nprint(saudacao("Ana"))   # Oi, Ana\n```\n\nO **return** devolve o resultado para quem chamou a função.'},

const EXERCISES = {
  lg1:'Escreva, em português, os passos de um algoritmo para atravessar a rua com segurança. Quantos passos você usou?',
  lg2:'Crie três variáveis: seu nome, seu período e se você já programou antes (True ou False). Depois imprima as três numa frase.',
  lg3:'Escreva um programa que recebe uma nota e imprime “Aprovada” se for 7 ou mais, “Recuperação” se estiver entre 5 e 6.9 e “Reprovada” abaixo de 5.',
  lg4:'Use um for para imprimir os números de 1 a 10. Depois, mude para imprimir só os pares.',
  lg5:'Crie uma função dobro(n) que devolve o dobro de um número. Teste com dobro(4).',
  lg6:'Crie uma função que recebe três notas e devolve a média com duas casas decimais.',

};

function looksLikeCode(t){ return /\n/.test(t) && /[=():;{}]|print|def |for |if /.test(t) || /^(def|for|while|if|print|import|let|const|function)\b/.test(t.trim()); }

function botReply(q, ctxId){
  const n = ' ' + norm(q) + ' ';
  const ctx = ctxId && etapaById(ctxId);
  if(/exercicio|praticar|pratica|gera/.test(n)){
    const ex = EXERCISES[ctxId] || EXERCISES.default;
    return {from:'bot', text:`Aqui vai um exercício${ctx?` sobre “${ctx.e.titulo}”`:''}:\n\n**${ex}**\n\nQuando terminar, cole o seu código aqui que eu comento.`, chips:['Me dá uma dica','Outro exercício']};
  }
  if(/me da uma dica|uma dica|^ dica /.test(n) && !/entrevista/.test(n)) return {from:'bot', text:'Dica: comece pelo caso mais simples e teste com um valor que você sabe o resultado. Se o resultado for diferente do esperado, imprima as variáveis no meio do caminho com print() para ver onde mudou.'};
  if(/outro exercicio/.test(n)) return {from:'bot', text:'**Faça uma lista com 5 números e imprima o maior deles sem usar max().**\n\nDica: guarde o primeiro número numa variável e compare com os outros num for.'};
  if(looksLikeCode(q)){
    const lines = q.split('\n').filter(l=>l.trim()).slice(0,6);
    const issues = [];
    if(/while/.test(q) && !/[+\-]=|=\s*\w+\s*[+\-]/.test(q)) issues.push('O **while** parece não alterar a variável da condição. Isso pode deixar o laço rodando para sempre.');
    if(/(if|for|while|def|else)[^:\n]*\n/.test(q) && !/(if|for|while|def|else)[^\n]*:/.test(q)) issues.push('Faltam os **dois-pontos (:)** no fim da linha do if/for/while/def.');
    if(/print [^(]/.test(q)) issues.push('Em Python 3, o print precisa de parênteses: `print("texto")`.');
    const expl = lines.map((l,i)=>`Linha ${i+1}: \`${l.trim().slice(0,60)}\``).join('\n');
    return {from:'bot', text: issues.length ? `Encontrei ${issues.length===1?'um ponto':'alguns pontos'} para revisar:\n\n${issues.map(x=>'• '+x).join('\n')}\n\nCorrija e me mande de novo que eu confiro.` : `Vamos ler o seu código por partes:\n\n${expl}\n\nNão encontrei erros de sintaxe. Teste com valores diferentes para conferir se o resultado é o esperado.`};
  }
  if(/corrig|meu codigo|bug|erro no/.test(n)) return {from:'bot', text:'Claro! Cole o seu código aqui na caixa de mensagem (use Shift + Enter para quebrar linha) e eu aponto o que pode estar errado.'};
  if(/explic/.test(n) && ctx && !KB.some(e=>e.k.some(k=>n.includes(' '+k)||n.includes(k)))) {
    return {from:'bot', text:`Resumo de “${ctx.e.titulo}”:\n\n${(ctx.e.texto||[]).join('\n\n')}${ctx.e.code?'\n\n```\n'+ctx.e.code+'\n```':''}\n\nQuer que eu gere um exercício sobre isso?`, chips:['Gerar um exercício']};
  }
  const hit = KB.find(e => e.k.some(k => k.length<=3 ? new RegExp('\\b'+k+'\\b').test(n) : n.includes(k)));
  if(hit) return {from:'bot', text:hit.r};
  if(/(o que e|como|por que|porque|qual|explique|explica)/.test(n) && ctx) return {from:'bot', text:`Sobre “${ctx.e.titulo}”: ${(ctx.e.texto||[''])[0]}\n\nSe a dúvida for outra, tente escrever com mais detalhes.`};
  return {from:'bot', warn:true, code:'CB01', text:ERR.CB01, chips:BOT_CHIPS};
}

FORM.cad = v => {
  const e = {}; UI.f.cad = {nome:v.nome, email:v.email, termos:v.termos, pron:v.pron};
  if(!v.nome.trim()) e.nome = required('Nome');
  if(!v.email.trim()) e.email = required('E-mail');
  else if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v.email.trim())) e.email = 'Digite um e-mail completo, como nome@exemplo.com.';
  else if(S.users.some(u => u.email.toLowerCase() === v.email.trim().toLowerCase())) e.email = 'Já existe uma conta com este e-mail. Entre com ela ou use outro e-mail.';
  if(!v.senha) e.senha = required('Senha');
  else if(v.senha.length < 6) e.senha = `A senha precisa ter pelo menos 6 caracteres. Faltam ${6 - v.senha.length}.`;
  if(!v.termos) e.termos = 'Marque que aceita os termos para criar a conta.';
  UI.err.cad = e;
  if(Object.keys(e).length){ render(); focusFirstInvalid(); return; }
  const id = 'u' + uid();
  S.users.push({id, nome:v.nome.trim(), email:v.email.trim(), senha:v.senha, role:'estudante', status:'ativo', desde:todayIso(), mentor:null, nivel:'Iniciante', pron: v.pron==='Prefiro não informar' ? '' : v.pron});
  S.week[id] = [0,0,0,0,0,0,0]; S.streak[id] = 0;
  notify(id, 'star', 'Boas-vindas ao Eliz!', 'Comece pela trilha Primeiros passos.', '/trilhas/primeiros-passos');
  S.session = id; save(); UI.f = {};
  UI.onb = {step:1, nivel:'novata', interesses:[]};
  go('/inicio'); openModal('onboarding');
};

ACT.onbNext = () => {

/* ---------- etapa (aula) ---------- */
function ytId(url){ const m = String(url||'').match(/(?:youtu\.be\/|v=|embed\/|shorts\/)([\w-]{11})/); return m ? m[1] : null; }
let vidTimer = null;
function stopVideo(){ if(vidTimer){ clearInterval(vidTimer); vidTimer = null; } if(UI.video) UI.video.playing = false; }
function captionFor(e, t){ const sent = (e.texto||[]).join(' ').split(/(?<=[.!?])\s+/).filter(Boolean); if(!sent.length) return ''; const i = Math.min(sent.length-1, Math.floor(t / e.video.dur * sent.length)); return sent[i]; }
function playerHtml(e){
  const id = ytId(e.videoUrl);
  if(id) return `<div class="video-embed"><iframe src="https://www.youtube-nocookie.com/embed/${id}?cc_load_policy=1&hl=pt-BR" title="Vídeo da aula: ${esc(e.titulo)}" allow="accelerometer; encrypted-media; picture-in-picture" allowfullscreen></iframe></div>`;

  return `<div class="player ${v.playing?'playing':''}" id="player" tabindex="0" role="region" aria-label="Vídeo da aula: ${esc(e.titulo)}, ${Math.round(dur/60)} minutos. Use Espaço para tocar ou pausar.">
    <div class="screen" data-act="vidToggle">
      <div class="screen-art" aria-hidden="true"><span class="scr-tag">Aula ${esc(e.titulo)}</span><span class="scr-wave"><i></i><i></i><i></i><i></i><i></i></span></div>
      ${v.playing ? '' : `<span class="big-play" aria-hidden="true">${icon('play')}</span>`}
      <p class="captions" id="vid-cc" ${v.cc?'':'hidden'} aria-live="off">${esc(v.t>0?captionFor(e,v.t):'')}</p>
    </div>
    <div class="controls">
      <button class="icon-btn" data-act="vidToggle" id="vid-play" aria-label="${v.playing?'Pausar':'Tocar'} vídeo">${icon(v.playing?'pause':'play')}</button>
      <span class="vid-time" id="vid-time" aria-hidden="true">${mmss(v.t)} / ${mmss(dur)}</span>
      <label class="sr-only" for="vid-seek">Posição do vídeo</label>
      <input type="range" id="vid-seek" min="0" max="${dur}" step="1" value="${Math.round(v.t)}" data-oninput="vidSeek" aria-valuetext="${mmss(v.t)} de ${mmss(dur)}">
      <button class="vid-chip" data-act="vidSpeed" aria-label="Velocidade ${String(v.speed).replace('.',',')}x">${String(v.speed).replace('.',',')}x</button>
      <button class="icon-btn" data-act="vidCC" aria-pressed="${v.cc}" aria-label="Legendas">${icon('cc')}</button>

}
function vidUpdate(e){
  const v = UI.video; if(!v) return; const dur = e.video.dur;
  const tm = $('#vid-time'); if(tm) tm.textContent = `${mmss(v.t)} / ${mmss(dur)}`;
  const sk = $('#vid-seek'); if(sk && document.activeElement !== sk){ sk.value = Math.round(v.t); sk.setAttribute('aria-valuetext', `${mmss(v.t)} de ${mmss(dur)}`); }
  const cc = $('#vid-cc'); if(cc) cc.textContent = v.t>0 ? captionFor(e, v.t) : '';
}
function curEtapa(){ return UI.video && etapaById(UI.video.eid); }
ACT.vidToggle = () => {
  const x = curEtapa(); if(!x) return; const v = UI.video; const e = x.e;
  if(v.playing){ stopVideo(); render(); $('#vid-play')?.focus(); return; }
  if(v.t >= e.video.dur) v.t = 0;
  v.playing = true; render(); $('#vid-play')?.focus();
  vidTimer = setInterval(() => {

  }, 500);
};

ACT.vidCC = el => { const v = UI.video; v.cc = !v.cc; el.setAttribute('aria-pressed', String(v.cc)); const cc=$('#vid-cc'); if(cc) cc.hidden = !v.cc; };

function vEtapa({id, eid}){

  const prev = t.etapas[i-1], nxt = t.etapas[i+1]; const s = stats(t,u.id);
  const mats = e.materiais || [];
  const tabs = [['aula','Aula'], ...(e.quiz?[['exercicio','Exercício']]:[]), ['materiais',`Materiais (${mats.length})`], ['notas','Minhas anotações']];

/* ---------- chatbot ---------- */
function botConv(id){
  if(!S.bot[id]) S.bot[id] = {ctx:null, msgs:[{from:'bot', text:'Oi! Eu sou o chatbot do Eliz. Posso explicar conteúdos das trilhas, gerar exercícios, explicar e corrigir trechos de código. Sobre o que você quer conversar?', chips:BOT_CHIPS}]};
  return S.bot[id];
}
function fmtBot(text){
  let h = esc(text);
  h = h.replace(/```([\s\S]*?)```/g, (_,c)=>`<pre class="code"><code>${c.replace(/^\n/,'')}</code></pre>`);
  h = h.replace(/`([^`]+)`/g, '<code class="inline">$1</code>').replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  return h.split(/\n{2,}/).map(p => p.startsWith('<pre') ? p : `<p>${p.replace(/\n/g,'<br>')}</p>`).join('');
}
function vChatbot(){
  const u = me(); const conv = botConv(u.id); const ctx = conv.ctx && etapaById(conv.ctx);
  const last = conv.msgs.length - 1;
  const msgs = conv.msgs.map((m,i) => m.from==='me'
    ? `<div class="msg me"><span class="sr-only">Você: </span>${esc(m.text).replace(/\n/g,'<br>')}</div>`
    : `<div class="msg them ${m.warn?'warn':''}"><span class="sr-only">Chatbot: </span>${fmtBot(m.text)}${m.code?`<span class="when">Código ELZ-${m.code}. <button type="button" class="linkish" data-act="help" data-code="${m.code}">Precisa de ajuda?</button></span>`:''}${m.chips && i===last?`<div class="chips" style="margin-top:12px" role="group" aria-label="Sugestões de perguntas">${m.chips.map(c=>`<button class="chip" data-act="chip" data-q="${esc(c)}">${esc(c)}</button>`).join('')}</div>`:''}</div>`).join('');
  return {title:'Chatbot', html:`
  <section class="chat" aria-labelledby="chat-h">
    <div class="chat-head"><span class="bot-mark" aria-hidden="true">${icon('bot')}</span><div style="flex:1; min-width:0"><h1 id="chat-h" class="chat-title">Chatbot do Eliz</h1><p class="tiny">Respostas automáticas. Para orientação de carreira, fale com uma pessoa mentora.</p></div>
      ${ctx ? `<span class="context-chip">Sobre: ${esc(ctx.e.titulo)}<button data-act="clearCtx" aria-label="Tirar o assunto “${esc(ctx.e.titulo)}” da conversa">${icon('x')}</button></span>` : ''}
      <button class="btn btn-ghost btn-sm" data-act="clearBot">Nova conversa</button></div>
    <div class="msgs" id="msgs" role="log" aria-live="polite" aria-label="Mensagens" tabindex="0">${msgs}${UI.typing.bot?'<div class="msg them"><span class="sr-only">O chatbot está escrevendo</span><span class="typing" aria-hidden="true"><i></i><i></i><i></i></span></div>':''}</div>
    <form class="composer" data-form="bot"><label class="sr-only" for="bot-in">Mensagem para o chatbot</label><textarea class="input" id="bot-in" name="q" rows="1" placeholder="Escreva sua dúvida ou cole um trecho de código" data-enter-send data-grow aria-describedby="bot-hint"></textarea><span id="bot-hint" class="sr-only">Enter envia. Shift mais Enter quebra a linha.</span><button class="btn btn-primary" aria-label="Enviar mensagem">${icon('send')}</button></form>
  </section>`, after(){ const m=$('#msgs'); if(m) m.scrollTop=m.scrollHeight; $('#bot-in')?.focus({preventScroll:true}); }};
}
FORM.bot = v => { const q = (v.q||'').trim(); if(!q) return; sendBot(q); };

function sendBot(q){
  const u = me(); const conv = botConv(u.id);
  if(offline()){ conv.msgs.push({from:'me', text:q}); conv.msgs.push({from:'bot', warn:true, code:'NET01', text:ERR.NET01 + ' Sua pergunta ficou guardada aqui.'}); save(); render(); return; }
  conv.msgs.push({from:'me', text:q}); save(); UI.typing.bot = true; render();
  setTimeout(() => { UI.typing.bot = false; conv.msgs.push(botReply(q, conv.ctx)); save(); if(currentPath()==='/chatbot') render(); }, 750);
}

/* ---------- progresso ---------- */
function vProgresso(){
  const u = me(); const d = done(u.id); const n = Object.keys(d).length; const pts = points(u.id); const pf = prefs();
  const week = S.week[u.id] || [0,0,0,0,0,0,0]; const mins = week.reduce((a,b)=>a+b,0);
  const going = visibleTrilhas().map(t=>({t, s:stats(t,u.id)})).filter(x=>x.s.n>0);
  const anyTrailDone = going.some(x=>x.s.pct===100);
  const hadMentoring = S.bookings.some(b=>b.est===u.id && ['confirmada','realizada'].includes(b.status));
  const badges = [
    ['Primeira etapa', n>=1, 'star'], ['3 dias seguidos', (S.streak[u.id]||0)>=3, 'flame'], ['Primeira mentoria', hadMentoring, 'calendar'],
    ['Primeira pergunta', (S.bot[u.id]?.msgs||[]).some(m=>m.from==='me'), 'bot'], ['Trilha concluída', anyTrailDone, 'award'], ['10 etapas', n>=10, 'map']];
  const myName = pf.rankingName ? first(u.nome)+' '+((u.nome.split(' ')[1]||'')[0]||'')+'.' : 'Você';
  const board = [...RANK_OTHERS, {nome:myName, pts, me:true}].sort((a,b)=>b.pts-a.pts);
  const maxW = Math.max(30, ...week); const dn = ['seg','ter','qua','qui','sex','sáb','dom'];
  const bars = week.map((v,i)=>{ const h = Math.max(4, v/maxW*120); return `<g><rect x="${i*52+14}" y="${140-h}" width="28" height="${h}" rx="6" fill="${v?'var(--violet)':'var(--violet-soft)'}"/><text x="${i*52+28}" y="160" text-anchor="middle" font-size="12" fill="var(--ink-2)">${dn[i]}</text>${v?`<text x="${i*52+28}" y="${134-h}" text-anchor="middle" font-size="11" fill="var(--ink-2)">${v}</text>`:''}</g>`; }).join('');
  return {title:'Progresso', html:`
  <div class="page-head"><div><h1>Seu progresso</h1><p>Acompanhe sua evolução no seu ritmo. Só você vê os detalhes; o ranking é opcional.</p></div></div>

  </div>

    <div>
      <section class="panel chart" aria-labelledby="h-ch"><h2 id="h-ch">Minutos de estudo por dia</h2><svg viewBox="0 0 364 170" role="img" aria-label="Minutos de estudo por dia nesta semana: ${week.map((v,i)=>dn[i]+' '+v).join(', ')}">${bars}</svg></section>
      <section class="panel" style="margin-top:20px" aria-labelledby="h-and"><h2 id="h-and">Trilhas em andamento</h2>
        ${going.length ? `<ul class="list">${going.map(({t,s})=>`<li><div class="grow"><a href="#/trilhas/${t.id}" class="strong-link">${esc(t.titulo)}</a><div style="margin-top:8px">${progress(s.pct)}</div></div><span class="small" style="width:5.5em; text-align:right">${s.n}/${s.total} etapas</span></li>`).join('')}</ul>`
          : `<div class="empty"><h3>Nenhuma trilha começada ainda</h3><p class="small">Comece pela trilha Primeiros passos para ver sua evolução aqui.</p><a class="btn btn-primary btn-sm" style="margin-top:14px" href="#/trilhas/primeiros-passos">Começar agora</a></div>`}

/* ---------- mentoria (quem estuda) ---------- */
const STATUS_TXT = {pendente:'Aguardando resposta', confirmada:'Confirmada', recusada:'Não aceita', cancelada:'Cancelada', realizada:'Realizada'};
function vMentoria(){
  const u = me(); const tab = UI.tab.mentoria || 'minhas';
  const mine = S.bookings.filter(b=>b.est===u.id).sort((a,b)=>(a.date+hh(a.hour)).localeCompare(b.date+hh(b.hour)));
  const pend = mine.filter(b=>b.status==='pendente'), conf = mine.filter(b=>b.status==='confirmada'), past = mine.filter(b=>['realizada','recusada','cancelada'].includes(b.status));
  const item = (b, actions) => { const m = mentor(b.mentor) || {nome:user(b.mentor)?.nome||'Pessoa mentora', id:b.mentor}; return `<li>${av(m.nome,m.id)}<div class="grow"><strong>${esc(m.nome)}</strong>${pron(m)}<p class="small muted cap">${esc(fmtDay(b.date))}, ${hh(b.hour)}. Videochamada de ${m.dur||30} min</p><p class="small">${esc(b.topic||'Sem assunto definido')}</p>${b.note?`<p class="small note-box">${icon('message')}${esc(b.note)}</p>`:''}</div><div class="row">${actions}</div></li>`; };
  const minhas = `
    <section class="panel" aria-labelledby="h-conf"><h2 id="h-conf">Mentorias confirmadas</h2>
    ${conf.length ? `<ul class="list">${conf.map(b=>item(b, `<a class="btn btn-secondary btn-sm" href="#/mentoria/chat/${b.mentor}">${icon('message')}Chat</a><button class="btn btn-ghost btn-sm" data-act="cancelBooking" data-id="${b.id}">Cancelar</button>`)).join('')}</ul>`
      : `<div class="empty"><h3>Nenhuma mentoria confirmada</h3><p class="small">Escolha uma pessoa mentora pela área de interesse e peça um horário.</p><button class="btn btn-primary btn-sm" style="margin-top:14px" data-act="tab" data-tab="mentoria" data-v="encontrar">Encontrar pessoa mentora</button></div>`}
    </section>
    ${pend.length ? `<section class="panel" style="margin-top:20px" aria-labelledby="h-pend"><h2 id="h-pend">Pedidos aguardando resposta</h2><p class="small muted" style="margin-bottom:10px">A pessoa mentora costuma responder em até um dia. Você recebe uma notificação.</p><ul class="list">${pend.map(b=>item(b, `<span class="tag comp">${icon('clock')}Aguardando</span><button class="btn btn-ghost btn-sm" data-act="cancelRequest" data-id="${b.id}">Cancelar pedido</button>`)).join('')}</ul></section>` : ''}

FORM.chat = v => {
  const text = (v.text||'').trim(); if(!text) return; const u = me(); const key = v.key;
  if(offline()){ UI.alert.chat = true; render(); return; }
  UI.alert.chat = null;
  (S.chats[key] ||= []).push({from:u.id, text, t:now()});
  const [a, b] = key.split('|'); const other = u.id===a ? b : a;
  notify(other, 'message', 'Nova mensagem', `${u.nome}: ${text.slice(0,60)}`, u.role==='mentoria' ? '/mentoria/chat/'+u.id : '/mentor/conversas/'+u.id);
  save(); render(); $('#chat-in')?.focus();
  UI.typing[key] = true; setTimeout(() => { if(UI.typing[key]){ render(); $('#chat-in')?.focus(); } }, 300);
  setTimeout(() => {
    UI.typing[key] = false;
    const pool = u.role==='mentoria' ? ['Valeu! Vou fazer isso hoje à noite.', 'Entendi, vou tentar de novo e te conto.', 'Combinado, até a mentoria!'] : MENTOR_REPLIES;
    S.chats[key].push({from:other, text:pool[S.chats[key].length % pool.length], t:now()}); save();
    if(currentPath().includes(other)) { render(); $('#chat-in')?.focus(); }
  }, 1700);
};

  S.trilhas.push({id, titulo:v.titulo.trim(), desc:v.desc.trim(), cat:v.cat, nivel:v.nivel, status:'rascunho', inscritas:0, autoria:me().id, objetivos:[], prereq:'Nenhum.', refs:[], etapas:[]}); save();
  UI.modal = null; renderModal(); go('/admin/trilhas/'+id); toast('Trilha criada como rascunho. Adicione as etapas e publique quando estiver pronta.');
};

function vATrilha({id}){

    <label class="row" style="gap:12px; cursor:pointer"><span class="small strong">Publicada</span><span class="switch"><input type="checkbox" data-act="togglePublish" data-id="${t.id}" ${t.status==='publicada'?'checked':''}><span class="sr-only">Trilha publicada</span></span></label></div>
  <div class="grid g-main" style="align-items:start">
    <section class="panel" aria-labelledby="h-et"><div class="panel-head"><h2 id="h-et">Etapas</h2><button class="btn btn-primary btn-sm" data-act="newStep" data-id="${t.id}">${icon('plus')}Adicionar etapa</button></div>
      ${t.etapas.length ? groupMods(t).map(g=>`<p class="mod-t">${esc(g.mod)}</p>${g.items.map(({e,i})=>`<div class="step-row"><span class="num" aria-hidden="true">${i+1}</span><div style="min-width:0"><strong>${esc(e.titulo)}</strong><p class="tiny">${e.min} min${e.video||e.videoUrl?', com vídeo':''}${e.quiz?', com exercício':''}${(e.materiais||[]).length?`, ${pl(e.materiais.length,'material','materiais')}`:''}</p></div>
        <div class="row" style="gap:2px; flex-wrap:nowrap"><button class="icon-btn" data-act="moveStep" data-id="${t.id}" data-i="${i}" data-d="-1" ${i===0?'disabled':''} aria-label="Mover “${esc(e.titulo)}” para cima">${icon('up')}</button><button class="icon-btn" data-act="moveStep" data-id="${t.id}" data-i="${i}" data-d="1" ${i===t.etapas.length-1?'disabled':''} aria-label="Mover “${esc(e.titulo)}” para baixo">${icon('down')}</button><button class="icon-btn" data-act="editStep" data-id="${t.id}" data-i="${i}" aria-label="Editar “${esc(e.titulo)}”">${icon('edit')}</button><button class="icon-btn" data-act="delStep" data-id="${t.id}" data-i="${i}" aria-label="Excluir “${esc(e.titulo)}”">${icon('trash')}</button></div></div>`).join('')}`).join('')
        : `<div class="empty"><h3>Esta trilha ainda não tem etapas</h3><p class="small">Adicione a primeira etapa para começar. Etapas curtas, de 5 a 20 minutos, funcionam melhor.</p></div>`}
    </section>
    <form class="panel" data-form="editTrail" novalidate aria-labelledby="h-inf"><h2 id="h-inf">Informações da trilha</h2><input type="hidden" name="id" value="${t.id}">
      <div class="field"><label for="et-t">Nome da trilha</label><input class="input" id="et-t" name="titulo" value="${val('titulo')}" ${inv(F,'titulo')}>${fieldErr(F,'titulo')}</div>
      <div class="field"><label for="et-d">Descrição</label><textarea class="input" id="et-d" name="desc" ${inv(F,'desc')}>${val('desc')}</textarea>${fieldErr(F,'desc')}</div>
      <div class="grid g2" style="gap:12px"><div class="field"><label for="et-c">Tipo</label><select class="input" id="et-c" name="cat">${[['tecnica','Técnica'],['comportamental','Comportamental'],['inicial','Ambientação']].map(([k,l])=>`<option value="${k}" ${t.cat===k?'selected':''}>${l}</option>`).join('')}</select></div>
      <div class="field"><label for="et-n">Nível</label><select class="input" id="et-n" name="nivel">${['Iniciante','Intermediário','Todos os níveis'].map(n=>`<option ${t.nivel===n?'selected':''}>${n}</option>`).join('')}</select></div></div>
      <div class="field"><label for="et-a">Curadoria</label><select class="input" id="et-a" name="autoria">${curators.map(c=>`<option value="${c.id}" ${t.autoria===c.id?'selected':''}>${esc(c.nome)} (${roleName(c.role)})</option>`).join('')}</select></div>
      <div class="field"><label for="et-o">O que a pessoa vai aprender</label><textarea class="input" id="et-o" name="objetivos" rows="4" aria-describedby="et-o-h">${esc((t.objetivos||[]).join('\n'))}</textarea><span class="hint" id="et-o-h">Um objetivo por linha.</span></div>
      <div class="field"><label for="et-p">Pré-requisitos</label><input class="input" id="et-p" name="prereq" value="${esc(t.prereq||'')}"></div>
      <div class="field"><label for="et-r">Referências</label><textarea class="input" id="et-r" name="refs" rows="4" aria-describedby="et-r-h">${esc((t.refs||[]).map(r=>r.texto+(r.url&&r.tipo!=='link'?'':'')+(r.url?' | '+r.url:'')).join('\n'))}</textarea><span class="hint" id="et-r-h">Uma referência por linha. Para incluir um link, use “Texto | https://...”.</span></div>
      <button class="btn btn-primary" style="width:100%">Salvar alterações</button>
      <button type="button" class="btn btn-ghost danger-text" style="width:100%; margin-top:8px" data-act="delTrail" data-id="${t.id}">${icon('trash')}Excluir trilha</button>
    </form>
  </div>`};
