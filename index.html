FORM.editTrail = v => {
  const t = trilha(v.id); const e = {}; UI.f.edit = v;
  if(!v.titulo.trim()) e.titulo = required('Nome da trilha');
  if(!v.desc.trim()) e.desc = required('Descrição');
  UI.err.edit = e; if(Object.keys(e).length){ render(); focusFirstInvalid(); return; }
  const refs = v.refs.split('\n').map(x=>x.trim()).filter(Boolean).map(line=>{ const [txt,url] = line.split('|').map(s=>s.trim()); return url ? {tipo:'link', texto:txt, url} : {tipo:'livro', texto:txt}; });
  Object.assign(t, {titulo:v.titulo.trim(), desc:v.desc.trim(), cat:v.cat, nivel:v.nivel, autoria:v.autoria, prereq:v.prereq.trim(), objetivos:v.objetivos.split('\n').map(x=>x.trim()).filter(Boolean), refs});
  save(); UI.f.edit = null; render(); toast('Alterações salvas.');
};
ACT.togglePublish = el => {
  const t = trilha(el.dataset.id);
  if(t.status!=='publicada' && !t.etapas.length){ el.checked = false; toast('Adicione pelo menos uma etapa antes de publicar a trilha.', {icon:'info'}); return; }
  const prev = t.status; t.status = prev==='publicada' ? 'rascunho' : 'publicada'; save(); render(); document.querySelector('[data-act="togglePublish"]')?.focus();
  toast(t.status==='publicada' ? 'Trilha publicada. Estudantes já podem vê-la.' : 'Trilha movida para rascunho. Estudantes deixam de vê-la.', {undo:()=>{ t.status=prev; save(); render(); }});
};
ACT.moveStep = el => { const t = trilha(el.dataset.id); const i = Number(el.dataset.i), j = i+Number(el.dataset.d); if(j<0||j>=t.etapas.length) return; [t.etapas[i],t.etapas[j]] = [t.etapas[j],t.etapas[i]]; if(t.etapas[i].mod!==t.etapas[j].mod){ const m=t.etapas[i].mod; t.etapas[i].mod=t.etapas[j].mod; t.etapas[j].mod=m; } save(); render(); document.querySelector(`[data-act="moveStep"][data-i="${j}"][data-d="${el.dataset.d}"]`)?.focus() || document.querySelector(`[data-act="moveStep"][data-i="${j}"]:not([disabled])`)?.focus(); };
ACT.delStep = el => {
  const t = trilha(el.dataset.id); const i = Number(el.dataset.i); const e = t.etapas[i];
  confirmBox({title:'Excluir esta etapa?', text:`“${e.titulo}” será removida da trilha ${t.titulo}. O progresso das pessoas nesta etapa deixa de contar.`, ok:'Excluir etapa', danger:true,
    onOk:()=>{ t.etapas.splice(i,1); save(); render(); toast('Etapa excluída.', {icon:'trash', undo:()=>{ t.etapas.splice(i,0,e); save(); render(); }}); }});
};
ACT.delTrail = el => {
  const t = trilha(el.dataset.id); const idx = S.trilhas.indexOf(t);
  confirmBox({title:'Excluir esta trilha?', text:`“${t.titulo}” e as ${t.etapas.length} etapas dela deixam de existir para todas as pessoas estudantes.`, ok:'Excluir trilha', danger:true,
    onOk:()=>{ S.trilhas.splice(idx,1); save(); go('/admin/trilhas'); toast('Trilha excluída.', {icon:'trash', undo:()=>{ S.trilhas.splice(idx,0,t); save(); render(); }}); }});
};
ACT.newStep = el => { const t = trilha(el.dataset.id); UI.err.step = {}; UI.f.step = {mod:(t.etapas[t.etapas.length-1]||{}).mod||'Conteúdo'}; openModal('stepForm', {tid:el.dataset.id, i:null}); };
ACT.editStep = el => { const t = trilha(el.dataset.id); const e = t.etapas[Number(el.dataset.i)]; UI.err.step = {};
  UI.f.step = {titulo:e.titulo, min:e.min, mod:e.mod||'', texto:(e.texto||[]).join('\n\n'), videoUrl:e.videoUrl||'', vmin:e.video?Math.round(e.video.dur/60):'', mats:(e.materiais||[]).map(m=>m.titulo+(m.url?' | '+m.url:'')).join('\n')};
  openModal('stepForm', {tid:t.id, i:Number(el.dataset.i)}); };
MODALS.stepForm = d => { const F='step'; const editing = d.i!=null; const t = trilha(d.tid); const mods = [...new Set(t.etapas.map(e=>e.mod).filter(Boolean))];
  return `<form class="modal wide" data-form="step" role="dialog" aria-modal="true" aria-labelledby="mt" novalidate><h2 id="mt">${editing?'Editar etapa':'Nova etapa'}</h2>
  <input type="hidden" name="tid" value="${d.tid}"><input type="hidden" name="i" value="${editing?d.i:''}">
  <div class="field" style="margin-top:14px"><label for="sf-t">Título</label><input class="input" id="sf-t" name="titulo" value="${fv(F,'titulo')}" ${inv(F,'titulo')} autofocus>${fieldErr(F,'titulo')}</div>
  <div class="grid g2" style="gap:12px"><div class="field"><label for="sf-mod">Módulo</label><input class="input" id="sf-mod" name="mod" list="mods" value="${fv(F,'mod')}"><datalist id="mods">${mods.map(m=>`<option value="${esc(m)}">`).join('')}</datalist></div>
  <div class="field"><label for="sf-m">Duração da etapa (minutos)</label><input class="input" id="sf-m" name="min" type="number" min="1" max="60" inputmode="numeric" value="${fv(F,'min')}" ${inv(F,'min')}>${fieldErr(F,'min')}</div></div>
  <fieldset class="fs box"><legend>Vídeo da aula <span class="muted small">(opcional)</span></legend>
    <div class="field"><label for="sf-v">Link do YouTube</label><input class="input" id="sf-v" name="videoUrl" type="url" inputmode="url" placeholder="https://www.youtube.com/watch?v=..." value="${fv(F,'videoUrl')}" ${inv(F,'videoUrl')} aria-describedby="sf-v-h">${fieldErr(F,'videoUrl')}<span class="hint" id="sf-v-h">Prefira vídeos com legenda em português.</span></div></fieldset>
  <div class="field"><label for="sf-x">Conteúdo em texto</label><textarea class="input" id="sf-x" name="texto" rows="6" ${inv(F,'texto')} aria-describedby="sf-x-h">${fv(F,'texto')}</textarea><span class="hint" id="sf-x-h">Separe os parágrafos com uma linha em branco. O texto também serve de transcrição para quem não pode ver ou ouvir o vídeo.</span>${fieldErr(F,'texto')}</div>
  <div class="field"><label for="sf-mt">Materiais <span class="muted small">(opcional)</span></label><textarea class="input" id="sf-mt" name="mats" rows="3" aria-describedby="sf-mt-h">${fv(F,'mats')}</textarea><span class="hint" id="sf-mt-h">Um material por linha, no formato “Título | https://...”.</span></div>
  <div class="actions"><button type="button" class="btn btn-secondary" data-act="closeModal">Cancelar</button><button class="btn btn-primary">${editing?'Salvar etapa':'Adicionar etapa'}</button></div></form>`; };
FORM.step = v => {
  const e = {}; UI.f.step = v; const m = Number(v.min);
  if(!v.titulo.trim()) e.titulo = required('Título');
  if(!v.min) e.min = required('Duração da etapa'); else if(!(m>=1 && m<=60)) e.min = 'Use um número entre 1 e 60 minutos.';
  if(v.videoUrl.trim() && !ytId(v.videoUrl)) e.videoUrl = 'Este link não parece ser do YouTube. Copie o endereço do vídeo, como https://www.youtube.com/watch?v=...';
  if(!v.texto.trim()) e.texto = required('Conteúdo em texto');
  UI.err.step = e; if(Object.keys(e).length){ renderModal(); focusFirstInvalid(); return; }
  const t = trilha(v.tid);
  const mats = v.mats.split('\n').map(x=>x.trim()).filter(Boolean).map(l=>{ const [ti,url]=l.split('|').map(s=>s.trim()); return url?{tipo:'link', titulo:ti, url}:{tipo:'pdf', titulo:ti}; });
  const data = {titulo:v.titulo.trim(), min:m, mod:v.mod.trim()||'Conteúdo', videoUrl:v.videoUrl.trim(), texto:v.texto.split(/\n\s*\n/).map(x=>x.trim()).filter(Boolean), materiais:mats};
  if(v.i===''){ t.etapas.push({id:'e'+uid(), ...data}); } else { Object.assign(t.etapas[Number(v.i)], data); }
  save(); UI.modal=null; renderModal(); render(); toast(v.i===''?'Etapa adicionada.':'Etapa salva.');
};

/* ---------- sugestões de conteúdo ---------- */
function vASugestoes(){
  const tab = UI.tab.sug || 'pendente';
  const list = S.suggestions.filter(s => tab==='todas' || s.status===tab);
  return {title:'Sugestões', html:`
  <div class="page-head"><div><h1>Sugestões de conteúdo</h1><p>Materiais e trilhas propostos por pessoas mentoras. Aprovar publica o material na trilha; recusar avisa quem sugeriu.</p></div></div>
  <div class="tabs" role="group" aria-label="Filtrar sugestões">${[['pendente','Em análise'],['aprovada','Publicadas'],['recusada','Não aprovadas'],['todas','Todas']].map(([k,l])=>`<button data-act="tab" data-tab="sug" data-v="${k}" aria-pressed="${tab===k}">${l}${k==='pendente'?` (${S.suggestions.filter(s=>s.status==='pendente').length})`:''}</button>`).join('')}</div>
  ${list.length ? `<div class="stack">${list.map(s=>{ const by = user(s.by); const t = s.trilha && trilha(s.trilha); const x = s.etapa && etapaById(s.etapa); const [st,cl] = SUG_STATUS[s.status];
    return `<article class="panel sug"><div class="spread" style="align-items:flex-start"><div class="row" style="flex-wrap:nowrap; align-items:flex-start">${icon(s.tipo==='trilha'?'map':s.mtipo==='video'?'video':s.mtipo==='exercicio'?'pencil':'link')}<div><h2 class="h3">${esc(s.titulo)}</h2><p class="small muted">${s.tipo==='trilha'?'Proposta de trilha nova':`${MTIPO[s.mtipo]||'Material'} para ${esc(t?t.titulo:'trilha removida')}${x?`, etapa “${esc(x.e.titulo)}”`:', material geral'}`}. Por ${esc(by?by.nome:'')} em ${fmtDate(s.data)}</p></div></div><span class="tag ${cl}">${st}</span></div>
      ${s.desc?`<p style="margin-top:10px">${esc(s.desc)}</p>`:''}${s.url?`<p class="small" style="margin-top:8px"><a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.url)}<span class="sr-only"> (abre em nova aba)</span></a></p>`:''}
      ${s.status==='pendente'?`<div class="row" style="margin-top:14px"><button class="btn btn-primary btn-sm" data-act="approveSug" data-id="${s.id}">${icon('check')}${s.tipo==='trilha'?'Aprovar e criar rascunho':'Aprovar e publicar'}</button><button class="btn btn-secondary btn-sm" data-act="rejectSug" data-id="${s.id}">Recusar</button></div>`:''}</article>`; }).join('')}</div>`
  : `<div class="empty"><h3>Nada por aqui</h3><p class="small">Nenhuma sugestão neste filtro.</p></div>`}`};
}
ACT.approveSug = el => {
  const s = S.suggestions.find(x=>x.id===el.dataset.id); let msg;
  if(s.tipo==='trilha'){
    const id = norm(s.titulo).replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'') + '-' + uid().slice(0,3);
    S.trilhas.push({id, titulo:s.titulo, desc:s.desc, cat:'tecnica', nivel:'Iniciante', status:'rascunho', inscritas:0, autoria:s.by, objetivos:[], prereq:'Nenhum.', refs:[], etapas:[]});
    msg = 'Trilha criada como rascunho, com curadoria de quem sugeriu.';
  } else {
    const t = trilha(s.trilha); const x = s.etapa && etapaById(s.etapa);
    if(x){ (x.e.materiais ||= []).push({tipo:s.mtipo==='livro'?'pdf':s.mtipo, titulo:s.titulo, url:s.url}); }
    else if(t){ (t.refs ||= []).push(s.url?{tipo:'link', texto:s.titulo, url:s.url}:{tipo:'livro', texto:s.titulo}); }
    msg = 'Material publicado na trilha.';
  }
  s.status = 'aprovada';
  notify(s.by, 'check', 'Sua sugestão foi publicada', `“${s.titulo}” foi aprovada pela equipe do Eliz.`, '/mentor/conteudos');
  save(); render(); toast(msg);
};
ACT.rejectSug = el => { UI.err.rej = {}; openModal('rejectSug', {id:el.dataset.id}); };
MODALS.rejectSug = d => { const s = S.suggestions.find(x=>x.id===d.id); return `<form class="modal" data-form="rejectSug" role="dialog" aria-modal="true" aria-labelledby="mt"><h2 id="mt">Recusar “${esc(s.titulo)}”?</h2><p class="muted">Quem sugeriu recebe uma notificação com a sua resposta.</p><input type="hidden" name="id" value="${s.id}">
  <div class="field" style="margin-top:16px"><label for="rj">Motivo <span class="muted small">(opcional)</span></label><textarea class="input" id="rj" name="msg" placeholder="Ex.: o conteúdo já está coberto na etapa 3." autofocus></textarea></div>
  <div class="actions"><button type="button" class="btn btn-secondary" data-act="closeModal">Voltar</button><button class="btn btn-danger">Recusar sugestão</button></div></form>`; };
FORM.rejectSug = v => { const s = S.suggestions.find(x=>x.id===v.id); s.status='recusada'; s.feedback=(v.msg||'').trim(); notify(s.by,'info','Sugestão não aprovada',`“${s.titulo}”${s.feedback?': '+s.feedback:'.'}`,'/mentor/conteudos'); save(); UI.modal=null; renderModal(); render(); toast('Sugestão recusada. Quem sugeriu foi avisado.', {undo:()=>{ s.status='pendente'; s.feedback=''; save(); render(); }}); };

}
ACT.approve = el => { const u = user(el.dataset.id); u.status='ativo'; if(u.role==='mentoria' && !S.mprof[u.id]) S.mprof[u.id] = {cargo:'Pessoa mentora', areas:['Carreira'], bio:'Perfil em construção.', aceitando:false, dur:30}; save(); render(); toast(`Cadastro de ${u.nome} aprovado.`, {icon:'userCheck', undo:()=>{ u.status='pendente'; save(); render(); }}); };
ACT.reject = el => { const u = user(el.dataset.id); confirmBox({title:'Recusar este cadastro?', text:`${u.nome} não terá acesso como pessoa mentora e recebe um e-mail avisando.`, ok:'Recusar cadastro', danger:true, onOk:()=>{ const i=S.users.indexOf(u); S.users.splice(i,1); save(); render(); toast('Cadastro recusado.', {undo:()=>{ S.users.splice(i,0,u); save(); render(); }}); }}); };
ACT.deactivate = el => { const u = user(el.dataset.id); confirmBox({title:`Desativar a conta de ${first(u.nome)}?`, text:'A pessoa deixa de conseguir entrar no Eliz. O histórico e o progresso ficam guardados e voltam se a conta for reativada.', ok:'Desativar conta', danger:true, onOk:()=>{ u.status='inativo'; save(); render(); toast('Conta desativada.', {undo:()=>{ u.status='ativo'; save(); render(); }}); }}); };
ACT.reactivate = el => { const u = user(el.dataset.id); u.status='ativo'; save(); render(); toast('Conta reativada.'); };
/* =====================================================================
   Eliz — configurações (diferentes para cada perfil)
   ===================================================================== */
function vConfig(){
  const u = me(); const s = S.settings; const p = prefs();
  const seg = (key, opts, label) => `<div class="seg" role="group" aria-label="${label}">${opts.map(([v,l,al])=>`<button data-act="seg" data-key="${key}" data-v="${v}" aria-pressed="${String(s[key])===String(v)}">${l}${al?`<span class="sr-only"> (${al.toLowerCase()})</span>`:''}</button>`).join('')}</div>`;
  const sw = (key, id) => `<span class="switch"><input type="checkbox" id="${id}" data-setting="${key}" ${p[key]?'checked':''}></span>`;
  const set = (id, title, desc, ctrl) => `<div class="setting"><div><label for="${id}" class="strong">${title}</label>${desc?`<p class="small muted" id="${id}-d">${desc}</p>`:''}</div>${ctrl}</div>`;
  const panel = (id, title, inner) => `<section class="panel" aria-labelledby="${id}"><h2 id="${id}">${title}</h2>${inner}</section>`;

  const aparencia = panel('h-ap','Aparência e leitura', `
    <div class="setting"><div><span class="strong" id="l-theme">Tema</span><p class="small muted">O escuro cansa menos a vista à noite.</p></div>${seg('theme',[['claro','Claro'],['escuro','Escuro'],['sistema','Sistema']],'Tema')}</div>
    <div class="setting"><div><span class="strong">Tamanho do texto</span><p class="small muted">Vale para todas as telas.</p></div>${seg('fs',[[0.9,'A−','Texto menor'],[1,'A','Texto padrão'],[1.15,'A+','Texto maior'],[1.3,'A++','Texto bem maior']],'Tamanho do texto')}</div>
    <div class="setting"><div><label for="st-contrast" class="strong">Alto contraste</label><p class="small muted">Reforça bordas, textos e cores. Ajuda quem tem baixa visão ou daltonismo.</p></div><span class="switch"><input type="checkbox" id="st-contrast" data-setting="contrast" ${s.contrast?'checked':''}></span></div>
    <div class="setting"><div><label for="st-motion" class="strong">Reduzir animações</label><p class="small muted">Desliga movimentos decorativos, como o do logotipo.</p></div><span class="switch"><input type="checkbox" id="st-motion" data-setting="motion" ${s.motion?'checked':''}></span></div>
    <p class="tiny" style="margin-top:8px">A fonte do Eliz (Atkinson Hyperlegible) foi desenhada para facilitar a leitura, inclusive para pessoas com baixa visão e dislexia.</p>`);

  const conta = panel('h-ct','Conta', `<div class="row" style="flex-wrap:nowrap">${av(u.nome,u.id,'lg')}<div><strong>${esc(u.nome)}</strong>${pron(u)}<p class="small muted">${esc(u.email)}. ${roleName(u.role)}</p></div></div>
    <form data-form="pron" class="setting" style="margin-top:12px"><div style="flex:1 1 200px"><label for="st-pron" class="strong">Pronomes</label><p class="small muted">Aparecem ao lado do seu nome no Eliz.</p></div><div class="row"><select class="input" id="st-pron" name="pron" style="width:auto">${PRONS.map(x=>`<option ${ (u.pron||'Prefiro não informar')===x?'selected':''}>${x}</option>`).join('')}</select><button class="btn btn-secondary btn-sm">Salvar</button></div></form>
    <button class="btn btn-secondary" style="margin-top:14px" data-act="logout">${icon('logout')}Sair da conta</button>`);

  let especificos = '';
  if(u.role==='estudante'){
    especificos = panel('h-nt','Lembretes e avisos', `
      ${set('st-lem','Lembrete diário de estudo','Um aviso por dia, no horário que você escolher.', sw('lembretes','st-lem'))}
      ${set('st-hora','Horário do lembrete','', `<select class="input select-sm" id="st-hora" data-setting="lembreteHora" ${p.lembretes?'':'disabled'}>${['08:00','12:00','19:00','21:00'].map(h=>`<option ${p.lembreteHora===h?'selected':''}>${h}</option>`).join('')}</select>`)}
      ${set('st-avm','Avisos de mentoria','Quando um pedido for respondido e uma hora antes de cada conversa.', sw('avisoMentoria','st-avm'))}
      ${set('st-res','Resumo semanal por e-mail','Seu progresso da semana, aos domingos.', sw('resumoSemanal','st-res'))}`)
    + panel('h-rk','Ranking e privacidade', `
      ${set('st-rk','Participar do ranking','Opcional. Seus pontos e conquistas continuam valendo de qualquer forma.', sw('ranking','st-rk'))}
      ${set('st-rkn','Mostrar meu nome no ranking','Desligado, você aparece em modo anônimo para as outras pessoas.', sw('rankingName','st-rkn'))}`);
  }
  if(u.role==='mentoria'){
    const mp = S.mprof[u.id] || {}; const F='mp';
    especificos = `<form class="panel" data-form="mprof" aria-labelledby="h-mp" novalidate><h2 id="h-mp">Perfil de mentoria</h2><p class="small muted" style="margin-bottom:14px">É o que as pessoas estudantes veem antes de pedir uma conversa com você.</p>
      <div class="field"><label for="mp-c">Cargo ou área de atuação</label><input class="input" id="mp-c" name="cargo" value="${fv(F,'cargo',mp.cargo)}" ${inv(F,'cargo')}>${fieldErr(F,'cargo')}</div>
      <div class="field"><label for="mp-a">Temas em que você pode ajudar</label><input class="input" id="mp-a" name="areas" value="${fv(F,'areas',(mp.areas||[]).join(', '))}" ${inv(F,'areas')} aria-describedby="mp-a-h"><span class="hint" id="mp-a-h">Separe por vírgula. Ex.: Back-end, Carreira, Entrevistas</span>${fieldErr(F,'areas')}</div>
      <div class="field"><label for="mp-b">Sobre você</label><textarea class="input" id="mp-b" name="bio" rows="3">${fv(F,'bio',mp.bio)}</textarea></div>
      <div class="grid g2" style="gap:12px"><div class="field"><label for="mp-d">Duração das conversas</label><select class="input" id="mp-d" name="dur">${[30,45,60].map(d=>`<option value="${d}" ${mp.dur===d?'selected':''}>${d} minutos</option>`).join('')}</select></div>
      <div class="field"><label class="check" style="margin-top:30px"><input type="checkbox" name="aceitando" ${mp.aceitando?'checked':''}><span>Aceitando novos pedidos</span></label></div></div>
      <button class="btn btn-primary">Salvar perfil</button></form>`
    + panel('h-nt','Notificações', `
      ${set('st-ns','Novos pedidos de mentoria','Assim que alguém pedir um dos seus horários.', sw('novasSolicitacoes','st-ns'))}
      ${set('st-msg','Mensagens de estudantes','Quando alguém escrever no chat.', sw('mensagens','st-msg'))}
      ${set('st-ls','Lembrete antes da conversa','Uma hora antes de cada mentoria confirmada.', sw('lembreteSessao','st-ls'))}
      ${set('st-rm','Resumo semanal das pessoas que você acompanha','Progresso nas trilhas, aos domingos.', sw('resumoMentorados','st-rm'))}`);
  }
  if(u.role==='admin'){
    especificos = panel('h-nt','Notificações', `
      ${set('st-cd','Novos cadastros de pessoas mentoras','Quando alguém pedir para entrar como pessoa mentora.', sw('cadastros','st-cd'))}
      ${set('st-sg','Sugestões de conteúdo','Quando uma pessoa mentora sugerir material ou trilha.', sw('sugestoes','st-sg'))}
      ${set('st-rl','Relatório semanal de uso','Números da plataforma, toda segunda-feira.', sw('relatorioSemanal','st-rl'))}`);
  }
  const demo = panel('h-dm','Demonstração', `<p class="small muted">Ferramentas para quem está avaliando o protótipo.</p>
    <div class="setting"><div><label for="st-off" class="strong">Simular perda de conexão</label><p class="small muted">Mostra o aviso de conexão interrompida.</p></div><span class="switch"><input type="checkbox" id="st-off" data-setting="offlineDemo" ${S.offlineDemo?'checked':''}></span></div>
    <div class="setting"><div><span class="strong">Restaurar dados de demonstração</span><p class="small muted">Apaga o que foi feito neste aparelho e volta ao início.</p></div><button class="btn btn-secondary btn-sm" data-act="resetDemo">Restaurar</button></div>`);
  return {title:'Configurações', html:`
  <div class="page-head"><div><h1>Configurações</h1><p>As mudanças valem na hora e ficam salvas neste aparelho.</p></div></div>
  <div class="settings-cols">${especificos}${aparencia}${conta}${demo}</div>`};
}
ACT.seg = el => { const k = el.dataset.key; S.settings[k] = k==='fs' ? Number(el.dataset.v) : el.dataset.v; save(); render(); document.querySelector(`[data-key="${k}"][aria-pressed="true"]`)?.focus(); };
ACT.setting = el => {
  const k = el.dataset.setting; const val = el.type==='checkbox' ? el.checked : el.value;
  if(k==='offlineDemo'){ S.offlineDemo = val; save(); render(); document.getElementById('st-off')?.focus(); if(val) toast('Simulação ligada. Veja o aviso no topo e tente enviar uma mensagem no chat.', {icon:'wifiOff'}); return; }
  if(k==='contrast' || k==='motion'){ S.settings[k] = val; save(); render(); document.querySelector(`[data-setting="${k}"]`)?.focus(); toast(k==='contrast' ? (val?'Alto contraste ligado.':'Alto contraste desligado.') : (val?'Animações reduzidas.':'Animações ligadas.')); return; }
  const p = prefs(); p[k] = val; save(); render();
  const msg = {ranking: val?'Você está participando do ranking.':'Você saiu do ranking. Seus pontos continuam valendo.', rankingName: val?'Seu nome agora aparece no ranking.':'Você aparece em modo anônimo no ranking.', lembretes: val?`Lembrete diário ligado para as ${p.lembreteHora}.`:'Lembrete diário desligado.', lembreteHora:`Lembrete marcado para as ${val}.`}[k] || (val ? 'Notificação ligada.' : 'Notificação desligada.');
  toast(msg);
  document.querySelector(`[data-setting="${k}"]`)?.focus();
};
FORM.pron = v => { const u = me(); u.pron = v.pron==='Prefiro não informar' ? '' : v.pron; save(); render(); toast('Pronomes salvos.'); };
FORM.mprof = v => {
  const e = {}; UI.f.mp = v;
  if(!v.cargo.trim()) e.cargo = required('Cargo ou área de atuação');
  if(!v.areas.trim()) e.areas = 'Coloque pelo menos um tema para as pessoas saberem em que você pode ajudar.';
  UI.err.mp = e; if(Object.keys(e).length){ render(); focusFirstInvalid(); return; }
  const mp = S.mprof[me().id] ||= {};
  Object.assign(mp, {cargo:v.cargo.trim(), areas:v.areas.split(',').map(x=>x.trim()).filter(Boolean), bio:v.bio.trim(), dur:Number(v.dur), aceitando:!!v.aceitando});
  UI.f.mp = null; save(); render(); toast(mp.aceitando ? 'Perfil salvo. Ele já aparece para quem procura mentoria.' : 'Perfil salvo. Você não aparece para novos pedidos enquanto estiver sem vagas.');
};
ACT.resetDemo = () => confirmBox({title:'Restaurar dados de demonstração?', text:'Todo o progresso, mensagens, pedidos e agendamentos feitos neste aparelho serão apagados, e você volta para a tela de entrada.', ok:'Restaurar dados', danger:true,
  onOk:()=>{ stopVideo(); S = seed(); save(); go('/login'); toast('Dados de demonstração restaurados.'); }});
render();
</script>
</body>
</html>
